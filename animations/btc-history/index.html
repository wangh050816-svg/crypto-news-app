  MARKS.forEach((e,k)=>{const t0=a+k*.12;if(t<t0)return;const p=eback(prog(t,t0,t0+.3));const up=e.k==='peak'||e.k==='up';const L=Math.log10(up?MO[e.i][3]:MO[e.i][4]);
    const x=sx(e.i+.5),y=sy(L)+(up?-1:1)*(24+(k%2)*46);ctx.save();ctx.translate(x,y);ctx.scale(p,p);pill(0,0,MARK_TXT[e.d],up?GREEN:RED,up?'#04140d':'#fff',`900 24px ${TC}`,'center',40);ctx.restore()});
}
function timeline(t,st){
  if(t>=DROP+BAR*1.5||t<I0-.5)return;const al=prog(t,I0-.5,I0)*(1-prog(t,DROP+BAR*1.3,DROP+BAR*1.5));const x0=60,x1=1020,y=1895;
  const f=st?(st.i+(t>=TEND?1:st.u))/N:0;ctx.save();ctx.globalAlpha=al;ctx.fillStyle='#22252f';ctx.fillRect(x0,y-3,x1-x0,6);ctx.fillStyle=ORANGE;ctx.fillRect(x0,y-3,(x1-x0)*f,6);
  for(const e of EV){const x=x0+(x1-x0)*(e.i+.5)/N;ctx.fillStyle=(e.k==='down'||e.k==='bottom')?RED:e.k==='info'?ORANGE:GREEN;ctx.globalAlpha=al*(t>=S[e.i]?1:.35);ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}
  ctx.globalAlpha=al;ctx.font=`22px ${NUM}`;ctx.fillStyle='#6b7180';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(String(MO[0][0]),x0,y-22);ctx.textAlign='right';ctx.fillText(String(MO[N-1][0]),x1,y-22);ctx.restore();
}
function hudFx(t){
  for(const e of EV){if(!e.ti||t<S[e.i]||t>S[e.i]+D[e.i]+.8)continue;const up=e.k==='up';
    const[ix,by]=[sx(e.i+.5),sy(Math.log10(e.P))];
    // 砰!!
    if(t>=e.ti&&t<e.tb+1.3){const k=eback(prog(t,e.ti,e.ti+.18)),al=1-prog(t,e.tb+.9,e.tb+1.3);const bx=clamp(ix-340,230,850),byy=clamp(by+(up?120:-190),560,1400);
      ctx.save();ctx.globalAlpha=al;ctx.translate(bx,byy);ctx.rotate(-.14);ctx.scale(k*.85,k*.85);ctx.beginPath();for(let i=0;i<36;i++){const r=i%2?175:290+((i*37)%5)*14,an=i/36*Math.PI*2;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r*.82)}ctx.closePath();
      ctx.fillStyle=up?'#7dffb0':YEL;ctx.fill();ctx.lineWidth=12;ctx.strokeStyle='#000';ctx.stroke();ctx.font=`900 180px ${TC}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=24;ctx.strokeStyle='#fff';ctx.strokeText(e.w,0,6);
      ctx.fillStyle=up?'#008a3e':'#e00018';ctx.fillText(e.w,0,6);ctx.restore()}
    // 大印章
    if(e.stamp&&t>=e.tb+.5&&t<S[e.i]+D[e.i]+.8){const tS=e.tb+.66,k=t<tS?lerp(3.2,1,ein(prog(t,e.tb+.5,tS))):1+.04*Math.exp(-(t-tS)*8),al=prog(t,e.tb+.5,e.tb+.6)*(1-prog(t,S[e.i]+D[e.i]+.4,S[e.i]+D[e.i]+.8));
      ctx.save();ctx.globalAlpha=al*.95;ctx.translate(560,1400);ctx.rotate(-.16);ctx.scale(k,k);ctx.font=`900 100px ${NUM}`;const w=Math.max(380,ctx.measureText(e.stamp).width+100);
      ctx.strokeStyle='#ff2a40';ctx.lineWidth=10;ctx.strokeRect(-w/2,-86,w,172);ctx.lineWidth=4;ctx.strokeRect(-w/2+18,-68,w-36,136);ctx.fillStyle='rgba(60,0,8,.65)';ctx.fillRect(-w/2+18,-68,w-36,136);
      ctx.fillStyle='#ff2a40';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.stamp,0,6);ctx.restore()}}
}
function flash(t){
  let a=0,c='255,255,255';
  for(const e of EV){if(!e.ti)continue;
    if(t>=e.ti&&t<e.ti+.35){a=Math.max(a,.45*(1-prog(t,e.ti,e.ti+.35)));c=e.k==='up'?'210,255,230':'255,225,215'}}
  for(const e of EV)if(e.tPk&&t>=e.tPk&&t<e.tPk+.25){a=Math.max(a,.3*(1-prog(t,e.tPk,e.tPk+.25)));c='255,240,200'}
  if(a>0){ctx.fillStyle=`rgba(${c},${a})`;ctx.fillRect(0,0,W,H)}
}
function vignette(t){
  let v=0;for(const e of EV){if(!e.ti)continue;if(t>e.ti-.8&&t<e.ti)v+=.4*prog(t,e.ti-.8,e.ti);if(e.k==='down'&&t>=e.ti&&t<S[e.i]+D[e.i]+.6)v+=.5*(1-prog(t,S[e.i]+D[e.i],S[e.i]+D[e.i]+.6))}
  if(v>0){const g=ctx.createRadialGradient(540,1000,380,540,1000,1150);g.addColorStop(0,'rgba(160,0,0,0)');g.addColorStop(1,`rgba(170,0,0,${Math.min(.7,v)})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
}
function render(t){
  ctx.setTransform(Q,0,0,Q,0,0);ctx.globalAlpha=1;ctx.fillStyle='#07080c';ctx.fillRect(0,0,W,H);
  const st=t>=S[0]?state(t):null;
  if(st){CAM=cam(t);const s=shake(t);ctx.save();ctx.translate(s.x,s.y);ctx.globalAlpha=prog(t,I0-.2,I0+.4);world(t,st);marks(t);ctx.restore()}
  intro(t);vignette(t);
  const s=shake(t);ctx.save();ctx.translate(s.x*.4,s.y*.4);header(t,st);ctx.restore();
  hudFx(t);
  const g=ctx.createLinearGradient(0,1560,0,1600);g.addColorStop(0,'rgba(7,8,12,0)');g.addColorStop(1,'rgba(7,8,12,.9)');ctx.fillStyle=g;ctx.fillRect(0,1560,W,40);ctx.fillStyle='rgba(7,8,12,.9)';ctx.fillRect(0,1600,W,320);
  eventCard(t);timeline(t,st);flash(t);
  const fade=Math.max(1-prog(t,0,.5),prog(t,T-.8,T));if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W,H)}
}

// ---------- 配樂與音效（WebAudio 合成）：128 BPM 燃系電音，K 線從 drop 開始跑，每次撞擊都落在拍點上 ----------
const NB=new WeakMap();
function noiseBuf(ac){if(!NB.has(ac)){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0),r=rng(3);for(let i=0;i<d.length;i++)d[i]=r()*2-1;NB.set(ac,b)}return NB.get(ac)}
function master(ac){const g=ac.createGain();g.gain.value=.85;const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.15;g.connect(comp).connect(ac.destination);return g}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// Am → F → C → G，每小節一個和弦
const PROG=[[57,60,64],[57,60,65],[55,60,64],[55,59,62]],ROOT=[45,41,48,43],ARP=[0,1,2,1,0,1,2,3,0,2,1,2,0,1,2,3];
// 播放器：建立一組音軌匯流排，之後依時間把樂譜裡的音符排進去
function mkAudio(ac,dest,base,from){
  const srcs=[],at=te=>base+(te-from),r=rng(11);
  const mus=ac.createGain();mus.gain.value=1.3;mus.connect(dest);const drm=ac.createGain();drm.gain.value=.9;drm.connect(dest);
  const padF=ac.createBiquadFilter();padF.type='lowpass';padF.frequency.value=2600;padF.Q.value=2;padF.connect(mus);
  const bassF=ac.createBiquadFilter();bassF.type='lowpass';bassF.frequency.value=700;bassF.Q.value=4;bassF.connect(mus);
  const env=(g,t0,vol,atk,dur)=>{g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+atk);g.gain.exponentialRampToValueAtTime(.0001,t0+dur)};
  const osc=(te,type,f0,f1,dur,vol,atk,out,det=0,hold=false)=>{const o=ac.createOscillator(),g=ac.createGain(),t0=at(te);o.type=type;o.detune.value=det;
    o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    if(hold){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+atk);g.gain.setValueAtTime(vol,t0+dur);g.gain.linearRampToValueAtTime(0,t0+dur+.3)}else env(g,t0,vol,atk,dur);
    o.connect(g).connect(out);o.start(t0);o.stop(t0+dur+.35);srcs.push(o)};
  const nz=(te,dur,vol,type,f0,f1,q,atk,out)=>{const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t0=at(te);
    s.buffer=noiseBuf(ac);s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    env(g,t0,vol,atk,dur);s.connect(f).connect(g).connect(out);s.start(t0,r()*1.5);s.stop(t0+dur+.05);srcs.push(s)};
  return{srcs,
    tone:(te,f0,f1,dur,type='sine',vol=.3,atk=.005)=>osc(te,type,f0,f1,dur,vol,atk,dest),
    noise:(te,dur,vol,type='lowpass',f0=1000,f1=f0,q=1,atk=.005)=>nz(te,dur,vol,type,f0,f1,q,atk,dest),
    kick:(te,v=1)=>{osc(te,'sine',170,42,.34,.95*v,.002,drm);nz(te,.02,.22*v,'highpass',3000,3000,1,.001,drm)},
    clap:(te,v=1)=>{for(const d of[0,.011,.023])nz(te+d,.17,.3*v,'bandpass',1500,1100,.9,.002,drm)},
    hat:(te,open,v=.08)=>nz(te,open?.22:.045,v,'highpass',8000,8000,1,.002,drm),
    crash:(te,v=.26)=>nz(te,1.8,v,'highpass',5200,3200,.7,.002,drm),
    bass:(te,m,dur)=>{osc(te,'sawtooth',mtof(m),mtof(m),dur,.2,.004,bassF);osc(te,'sine',mtof(m-12),mtof(m-12),dur,.3,.004,mus)},
    pad:(te,ch,dur,v=.035)=>{for(const m of ch)for(const d of[-12,12])osc(te,'sawtooth',mtof(m),mtof(m),dur,v,.12,padF,d,true)},
    lead:(te,m,dur,v=.06)=>{for(const d of[-8,8])osc(te,'sawtooth',mtof(m),mtof(m),dur,v,.01,padF,d,true)},
    arp:(te,m,v=.045)=>osc(te,'square',mtof(m),mtof(m),.11,v,.003,mus),
    riser:(te,dur,v=.3)=>{nz(te,dur,v,'highpass',300,8000,1,dur*.92,dest);osc(te,'sawtooth',110,880,dur,.045,dur*.92,dest)},
    filt:(te,f,ramp)=>{const t0=at(te);padF.frequency.setValueAtTime(padF.frequency.value,t0);padF.frequency.linearRampToValueAtTime(f,t0+ramp)},
    pump:(te,v)=>{const t0=at(te);mus.gain.setValueAtTime(.4*v,t0);mus.gain.linearRampToValueAtTime(1.5*v,t0+BEAT*.55)},
  };
}
// 樂譜：[時間, (播放器)=>排音符]，即時播放和匯出共用
const SCORE=(()=>{
  const sc=[],add=(te,f)=>sc.push([te,f]),r=rng(11);
  const duck=te=>{for(const e of EV)if(e.ti&&te>=e.ti-e.A-.01&&te<e.ti-.01)return .35;return 1};
  const LEAD=[[76,2],[74,1],[72,1],[71,2],[72,1],[74,1],[76,2],[79,2],[76,3],[74,1]]; // 每兩小節一句的主旋律（拍數）
  add(0,P=>P.filt(0,500,.01));add(I0-BAR,P=>P.filt(I0-BAR,2600,BAR));
  const nb=Math.ceil(T/BEAT);
  for(let b=0;b<nb;b++){
    const te=b*BEAT,bar=Math.floor(b/4),bt=b%4,ch=PROG[bar%4];
    const sec=te<I0-.01?'intro':te<TEND+BAR-.01?'main':te<DROP-.01?'break':te<DROP+BAR*2-.01?'final':'tail';
    const full=sec==='main'||sec==='final';
    if(full){add(te,P=>P.kick(te));if(bt%2)add(te,P=>P.clap(te));add(te,P=>P.pump(te,duck(te)));
      for(const k of[1,2,3])add(te+k*BEAT/4,P=>P.hat(te+k*BEAT/4,k===2&&bt===3,k===2?.1:.05));
      for(const k of[0,1])add(te+k*BEAT/2,P=>P.bass(te+k*BEAT/2,ROOT[bar%4]+(k&&bt===3?12:0),BEAT/2*.85))}
    if(sec==='intro'&&bar>=2)add(te,P=>P.kick(te,.8));
    if(sec==='intro'&&bar===3)for(let k=0;k<(bt<2?2:4);k++){const tt=te+k*BEAT/(bt<2?2:4);add(tt,P=>P.clap(tt,.4+.15*bt))}
    if(bt===0&&sec!=='tail')add(te,P=>P.pad(te,ch,BAR-.05,sec==='intro'?.03:.035));
    if(sec==='tail'&&te<DROP+BAR*2+.01)add(te,P=>P.pad(te,PROG[0],BAR*2.5,.04));
    if(sec!=='intro'&&sec!=='tail')for(let k=0;k<4;k++){const tt=te+k*BEAT/4;add(tt,P=>P.arp(tt,ch[Math.min(2,ARP[(bt*4+k)%16])]+12+(ARP[(bt*4+k)%16]===3?12:0),sec==='break'?.035:.045))}
  }
  // 主旋律：K 線跑的時候每 8 小節出現一次，讓整首更有記憶點
  for(let s=I0;s<TEND-BAR*2;s+=BAR*8){let x=s;for(const[m,beats]of LEAD){const tt=x,d=beats*BEAT;add(tt,P=>P.lead(tt,m,d*.9));x+=d}}
  add(I0,P=>{P.crash(I0,.32);P.noise(I0,1.2,.6,'lowpass',3000,60,.7)});add(I0-BAR,P=>P.riser(I0-BAR,BAR));
  add(DROP-BAR*1.5,P=>P.riser(DROP-BAR*1.5,BAR*1.5));add(DROP,P=>{P.crash(DROP,.32);P.tone(DROP,110,40,2.5,'sine',.6)});
  // 開場音效
  for(let k=0;k<26;k++){const tt=.8+k*.054;add(tt,P=>P.tone(tt,1800+r()*600,1800,.02,'square',.02,.002))}
  add(3.0,P=>{P.tone(3.0,330,330,.5,'triangle',.12);P.tone(3.15,495,495,.6,'triangle',.1)});
  add(5.5,P=>{P.tone(5.5,260,520,.15,'sine',.2);P.tone(5.65,330,660,.15,'sine',.2)});
  // 事件音效
  for(const e of EV){const t0=S[e.i];
    if(e.ti){const up=e.k==='up';
      if(e.swan){add(t0+.1,P=>P.noise(t0+.1,.9,.12,'bandpass',800,2400,2,.4));add(t0+e.pre-.25,P=>{P.tone(t0+e.pre-.25,900,500,.35,'sawtooth',.07);P.tone(t0+e.pre,130,50,.3,'sine',.5)})}
      add(e.ti-e.A,P=>P.riser(e.ti-e.A,e.A,.28));
      add(e.ti,P=>{P.noise(e.ti,1.6,.85,'lowpass',3200,60,.7);P.tone(e.ti,150,30,1.4,'sine',.9);P.crash(e.ti);
        P.noise(e.ti+.02,.7,.45,'highpass',2500,6000,.7);for(let k=0;k<10;k++){const tt=e.ti+.03+k*.045;P.noise(tt,.07,.3,'bandpass',1500+r()*4500,1500+r()*4500,3)}
        if(up)for(let k=0;k<6;k++)P.tone(e.ti+k*.06,1800+r()*1600,1800+r()*1600,.25,'sine',.05)});
      if(e.stamp)add(e.tb+.66,P=>{P.tone(e.tb+.66,170,45,.45,'sine',.7);P.noise(e.tb+.66,.25,.4,'lowpass',1600,200)})}
    if(e.tPk)for(const k of[0,.18,.32])add(e.tPk+k,P=>P.noise(e.tPk+k,.5,.35,'bandpass',2000,600,1.5));
    if(e.k==='info')add(t0+.3,P=>{P.tone(t0+.3,1320,1320,.5,'sine',.14);P.tone(t0+.45,1760,1760,.7,'sine',.12)});
    if(e.k==='bottom')add(t0+.66,P=>{P.tone(t0+.66,170,45,.45,'sine',.7);P.noise(t0+.66,.25,.4,'lowpass',1600,200)});
  }
  return sc.sort((a,b)=>a[0]-b[0]);
})();
function scheduleRange(P,from,a,b){for(const[te,f]of SCORE)if(te>=a&&te<b&&te>=from)f(P)}
window.renderAudioWav=async()=>{
  const sr=48000,oc=new OfflineAudioContext(2,Math.ceil(sr*T),sr);scheduleRange(mkAudio(oc,master(oc),0,0),0,0,T+1);const b=await oc.startRendering();
  const n=b.length,L=b.getChannelData(0),Rc=b.getChannelData(1),ab=new ArrayBuffer(44+n*4),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){v.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);v.setInt16(46+i*4,clamp(Rc[i],-1,1)*32767,true)}
  const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);
};

// ---------- 字型、播放控制 ----------
const SRC=document.currentScript.textContent.replace(/\/\*DATA\*\/.*?\/\*END\*\//s,'');
window.T=T;
window.ready=Promise.race([Promise.all([document.fonts.load(`900 60px "Noto Sans TC"`,SRC),document.fonts.load(`500 30px "Noto Sans TC"`,SRC),document.fonts.load('60px Anton','$0123456789,.%+-×→ABCDEFGHIJKLMNOPQRSTUVWXYZ')]),new Promise(r=>setTimeout(r,4000))]).catch(()=>{});
window.renderAt=render;
if(EXPORT){cv.style.width=W+'px';cv.style.height=H+'px'}
else{
  let t=0,playing=true,last=null,ac=null,mg=null,P=null,sched=0,base=0,from=0,snd=false,idle;
  const ui=document.getElementById('ui'),bPlay=document.getElementById('bPlay'),bSnd=document.getElementById('bSnd'),seek=document.getElementById('seek');seek.max=T;
  const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';Q=clamp(s*Math.min(devicePixelRatio||1,2),.4,1);cv.width=Math.round(W*Q);cv.height=Math.round(H*Q)};addEventListener('resize',fit);fit();
  const stopAudio=()=>{if(P)P.srcs.forEach(s=>{try{s.stop()}catch(e){}});P=null;if(mg){mg.disconnect();mg=null}};
  // 邊播邊排：只排未來 1.5 秒內的音符，播放器不會一次塞幾千個節點
  const pump=()=>{if(!P)return;const end=Math.min(T+1,t+1.5);if(end>sched){scheduleRange(P,from,sched,end);sched=end}P.srcs.splice(0,Math.max(0,P.srcs.length-600))};
  const startAudio=()=>{stopAudio();if(!snd||!playing||!ac)return;mg=master(ac);from=t;base=ac.currentTime+.05;P=mkAudio(ac,mg,base,from);sched=t;pump()};
  const setPlay=p=>{playing=p;bPlay.textContent=p?'⏸ 暫停':'▶ 播放';p?startAudio():stopAudio()};
  bPlay.onclick=()=>setPlay(!playing);
  document.getElementById('bRe').onclick=()=>{t=0;setPlay(true)};
  bSnd.onclick=()=>{snd=!snd;bSnd.classList.toggle('on',snd);bSnd.textContent=snd?'🔊 音效開':'🔊 開啟音效';
    if(snd){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();t=0;setPlay(true)}else stopAudio()};
  seek.oninput=()=>{t=+seek.value;if(playing)startAudio()};
  cv.onclick=()=>setPlay(!playing);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlay(false)});
  const wake=()=>{ui.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>ui.classList.add('hide'),2500)};addEventListener('pointermove',wake);addEventListener('pointerdown',wake);wake();
  window.ready.then(()=>{
    const loop=now=>{if(last==null)last=now;const dt=Math.min(.1,(now-last)/1000);last=now;
      if(playing){t=P?Math.max(t,from+ac.currentTime-base):t+dt;if(t>=T){t=0;startAudio()}pump()}
      render(t);seek.value=t;requestAnimationFrame(loop)};
    requestAnimationFrame(loop)});
}

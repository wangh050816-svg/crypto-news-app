function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
function charCount(s){ return [...String(s||"").replace(/\s/g,"")].length; }
function statusChip(s){ if(s==="已核可") s="已審核"; const c = s==="已發布"?"ok":(s==="已審核"?"":"wait"); return `<span class="chip ${c}">${esc(s||"待審")}</span>`; }

function tick(){
  $("now").textContent = fmt(Date.now(), {month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  renderNext();
}

const PICK_ORDER = {"首選":0,"備選A":1,"備選B":2};
const PICK_LABEL = {"首選":"① 今日首選","備選A":"② 今日備選 A","備選B":"③ 今日備選 B"};
function card(p, label){
  const n = charCount(p.body), bad = n < 100 || n > 180;
  const v = p.verify || {}, vs = v.status || "待確認";
  const vc = vs==="可發布" ? "ok" : (vs==="不可發布" ? "bad" : "wait");
  const sc = p.score;
  const unc = (v.unconfirmed || p.doubts || []).map(d=>`<li>${esc(d)}</li>`).join("");
  const srcs = (p.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a></li>`).join("");
  const scoreTxt = sc ? `時效 ${sc.timeliness}・重要 ${sc.importance}・討論 ${sc.discussion}・內容 ${sc.value}・可信 ${sc.credibility}` : "";
  return `<article class="panel post" data-id="${esc(p.id)}">
    <div class="post-head">
      ${label?`<span class="chip lead">${esc(label)}</span>`:`<span class="chip">${esc(p.slot||"文章")}</span>`}${(p.domain||p.category)?`<span class="chip">${esc(p.domain||p.category)}</span>`:""}<span class="chip ${vc}">${esc(vs)}</span>${statusChip(p.status)}
      ${sc?`<span class="score">${sc.total}/25</span>`:""}
      <span class="meta">${esc(p.date||"")}${p.publishAt?` · 建議發布 ${esc(p.publishAt)}`:""}</span>
      <h2>${esc(p.title||"")}</h2>
    </div>
    ${vs!=="可發布"?`<p class="note" style="color:var(--seal)">關鍵資訊尚未完全確認，發布前請先看下方「尚未確認」。</p>`:""}
    <div class="body">${esc(p.body)}</div>
    <div class="row">
      <button class="primary" data-act="copy">複製文章</button>
      <button data-act="copyc"${p.comment?"":" disabled"}>複製留言</button>
      <span class="count ${bad?"bad":""}">${n} 字${bad?(n>180?"・超過 180":"・少於 100"):""}</span>
      <span style="flex:1"></span>
      <button data-act="status" data-s="已審核">標記已審核</button>
      <button data-act="status" data-s="已發布">標記已發布</button>
    </div>
    <details class="vbox"><summary>留言、查證與來源</summary>
      <dl class="vgrid">
        ${p.comment?`<dt>留言補充</dt><dd>${esc(p.comment)}</dd>`:""}
        ${p.reason?`<dt>選題理由</dt><dd>${esc(p.reason)}</dd>`:""}
        ${v.eventDate?`<dt>事件日期</dt><dd>${esc(v.eventDate)}</dd>`:""}
        ${v.updatedAt?`<dt>最新資訊</dt><dd>${esc(v.updatedAt)}</dd>`:""}
        ${p.checkedAt?`<dt>查證時間</dt><dd>${esc(p.checkedAt)}</dd>`:""}
        ${scoreTxt?`<dt>評分</dt><dd class="score">${scoreTxt}</dd>`:""}
        ${v.facts?`<dt>已確認</dt><dd>${esc(v.facts)}</dd>`:""}
        ${v.opinion?`<dt>評論推測</dt><dd>${esc(v.opinion)}</dd>`:""}
      </dl>
      ${unc?`<div><b>尚未確認</b><ul>${unc}</ul></div>`:""}
      ${srcs?`<div><b>原始來源</b><ul>${srcs}</ul></div>`:""}
    </details>
  </article>`;
}

function renderPost(){
  const el = $("post");
  const picked = posts.filter(p => p.pick && PICK_ORDER[p.pick] !== undefined);
  let day = picked.map(p=>p.date||"").sort().pop();
  let list = picked.filter(p => p.date === day).sort((a,b)=>PICK_ORDER[a.pick]-PICK_ORDER[b.pick]);
  if(!list.length){
    const mains = posts.filter(p => p.slot==="主文");
    day = mains[0]?.date; list = mains.filter(p => p.date === day).slice(0,3);
  }
  $("pickDate").textContent = day || "";
  el.innerHTML = list.length ? list.map(p => card(p, PICK_LABEL[p.pick])).join("")
    : `<div class="panel empty">還沒有文章。每天 08:47 的排程會放上三篇推薦。</div>`;
  const pre = posts.filter(p => p.slot==="預熱" || p.slot==="公布後").slice(0,3);
  $("preheat").innerHTML = pre.length ? pre.map(p => card(p)).join("")
    : `<div class="panel empty">近期沒有事件預熱文章。</div>`;
  const d = $("detail"), sp = posts.find(x => x.id === selected);
  d.hidden = !sp; d.innerHTML = sp ? card(sp) : "";
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const p = posts.find(x => x.id === b.closest("[data-id]")?.dataset.id); if(!p) return;
  if(b.dataset.act==="copy") copy(p.body, b);
  else if(b.dataset.act==="copyc") copy(p.comment||"", b);
  else setStatus(p, b.dataset.s, b);
});

async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); toast("已複製"); }
  catch{ const t = btn?.closest("article")?.querySelector(".body"); if(t){ const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast("已選取文字，請按複製"); }
}

async function setStatus(p, s, btn){
  if(!db){ toast("只有站長可以修改狀態"); return; }
  btn.disabled = true;
  try{ await db.doc("posts/"+p.id).update({status:s}); toast("已標記為「"+s+"」"); }
  catch(e){ toast(e?.code==="invalid_argument" ? "你沒有修改權限" : "更新失敗，請稍後再試"); }
  finally{ btn.disabled = false; }
}

function renderArchive(){
  const el = $("archive");
  if(!posts.length){ el.innerHTML = `<div class="empty">存檔是空的。</div>`; return; }
  const recent = posts.slice(0,20), cnt = {};
  recent.forEach(p => { const k = p.domain || p.category; if(k) cnt[k] = (cnt[k]||0) + 1; });
  const ks = Object.entries(cnt).sort((a,b) => b[1]-a[1]);
  const mix = ks.length ? `<div class="mix" title="最近 20 篇文章的領域分布">${ks.map(([k,n])=>{const pct=Math.round(n/recent.length*100);
    return `<div><span>${esc(k)}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="v">${n} 篇・${pct}%</span></div>`}).join("")}</div>` : "";
  el.innerHTML = mix + posts.map(p=>`<button class="arow ${p.id===selected?"on":""}" data-id="${esc(p.id)}">
      <span class="meta">${esc(p.date||"")}</span><span class="sl chip">${esc(p.slot||"")}</span>
      <span class="ti">${esc(p.title||"")}</span>${statusChip(p.status)}</button>`).join("");
  el.querySelectorAll(".arow").forEach(b => b.onclick = () => { selected = selected===b.dataset.id ? null : b.dataset.id; renderPost(); renderArchive(); if(selected) $("detail").scrollIntoView({behavior:"smooth",block:"start"}); });
}

function renderCal(){
  const el = $("cal");
  if(!events.length){ el.innerHTML = `<div class="empty">日曆是空的。每週日 19:37 的排程會建立未來 14 天事件。</div>`; return; }
  const now = Date.now();
  el.innerHTML = events.map(e=>{
    const t = new Date(e.at).getTime();
    const day = fmt(e.at,{month:"2-digit",day:"2-digit"});
    const w = new Date(new Date(e.at).toLocaleString("en-US",{timeZone:TZ})).getDay();
    const hm = e.timeTbc ? "時間待定" : fmt(e.at,{hour:"2-digit",minute:"2-digit",hour12:false});
    return `<div class="ev ${t < now-3600e3 ? "past":""}">
      <div class="d"><b>${day}</b>週${WD[w]} ${hm}</div>
      <div><div class="t"><span class="dot ${e.impact==="high"?"high":""}"></span>${esc(e.name)}${e.status==="tbc"?` <span class="tbc">待確認</span>`:""}</div>
      ${e.detail?`<div class="x">${esc(e.detail)}</div>`:""}</div></div>`;
  }).join("");
}

function renderNext(){
  const el = $("next"); if(!events.length) return;
  const now = Date.now();
  const e = events.find(x => x.impact==="high" && new Date(x.at).getTime() > now);
  if(!e){ el.innerHTML = `<div class="note">14 天內沒有已排定的高影響事件。</div>`; return; }
  let d = Math.max(0, new Date(e.at).getTime() - now)/1000;
  const dd = Math.floor(d/86400); d%=86400; const hh=Math.floor(d/3600); d%=3600; const mm=Math.floor(d/60), ss=Math.floor(d%60);
  const pad = n => String(n).padStart(2,"0");
  el.innerHTML = `<div class="name">${esc(e.name)}</div>
    <div class="meta">${fmt(e.at,{month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false})} 台北</div>
    <div class="cd">T−${dd}天 ${pad(hh)}:${pad(mm)}:${pad(ss)}</div>
    ${e.preheat?`<div class="note">預熱文建議：${esc(e.preheat)}</div>`:""}`;
}

function renderBrief(b){
  const el = $("brief");
  if(!b){ el.innerHTML = `<div class="empty">每天早上會把當天的 8 則候選新聞放在這裡。</div>`; return; }
  $("briefDate").textContent = b.date || "";
  el.innerHTML = (b.items||[]).map(it=>`<div class="bi ${it.picked?"pick":""}">
    <div class="row">${it.domain?`<span class="chip">${esc(it.domain)}</span>`:""}${it.picked?`<span class="chip ok">已選為主文</span>`:""}${it.backup?`<span class="chip wait">備用</span>`:""}${it.score?`<span class="score">${esc(it.score.total)}/25</span>`:""}<span class="meta">${esc(it.at||"")}</span></div>
    <h4>${esc(it.title)}</h4><p>${esc(it.summary||"")}</p>${it.why?`<p class="why">${esc(it.why)}</p>`:""}
    ${it.source?.url?`<a href="${esc(it.source.url)}" target="_blank" rel="noopener">${esc(it.source.label||it.source.url)}</a>`:""}</div>`).join("");
}

async function start(){
  tick(); setInterval(tick, 1000);
  let S = {};
  try{ S = JSON.parse($("snap").textContent || "{}"); }catch{}
  posts = (S.posts||[]).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  events = (S.events||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  renderPost(); renderArchive(); renderCal(); renderNext(); renderBrief(S.brief);
  if(S.updatedAt) $("sync").textContent = "資料更新於 " + S.updatedAt;
  db = await (window.claude?.use ? window.claude.use("db") : null);
  if(!db) return;
  db.collection("posts").orderBy("createdAt","desc").limit(60).onSnapshot(s=>{
    if(!s.metadata.fromCache) $("sync").textContent = "即時資料";
    if(s.empty) return;
    posts = s.docs.map(d=>({id:d.id, ...d.data()}));
    renderPost(); renderArchive();
  }, ()=>{});
  db.collection("briefs").orderBy("date","desc").limit(1).onSnapshot(s=>{
    if(!s.empty) renderBrief(s.docs[0].data());
  }, ()=>{});
  db.collection("events").orderBy("at","asc").limit(100).onSnapshot(s=>{
    if(s.empty) return;
    events = s.docs.map(d=>({id:d.id, ...d.data()}));
    renderCal(); renderNext();
  }, ()=>{});
}
start();
</script>

<title>纏道漫長 情報台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a trading-desk bulletin, read top to bottom: summary, news radar, three picks, events and calendar, performance, archive and favourites. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#18202c; --muted:#5b6575; --line:#d5dae2;
  --accent:#23406e; --accent-soft:#e3e9f4; --seal:#b3261e;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbefd6;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171d27; --ink:#e6e9ef; --muted:#97a1b3; --line:#2a3342;
  --accent:#8fb0e6; --accent-soft:#1f2b40; --seal:#ef6a5e;
  --ok:#5cc58f; --ok-soft:#163325; --warn:#e3b257; --warn-soft:#382a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171d27; --ink:#e6e9ef; --muted:#97a1b3; --line:#2a3342;
  --accent:#8fb0e6; --accent-soft:#1f2b40; --seal:#ef6a5e;
  --ok:#5cc58f; --ok-soft:#163325; --warn:#e3b257; --warn-soft:#382a10; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:22px;line-height:1;border-radius:4px;transform:rotate(-4deg)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.clock b{color:var(--ink);font-weight:500;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 10px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.post{padding:22px 24px;display:grid;gap:16px}
.post-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.post h2{font-family:var(--display);font-weight:900;font-size:22px;margin:0;line-height:1.35;flex-basis:100%;text-wrap:balance}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.body{white-space:pre-wrap;font-size:16px;line-height:1.85;padding:16px 18px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 4px 4px 0;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.count.bad{color:var(--warn)}
.extra{display:grid;gap:12px}
.extra h3{font-size:13px;margin:0 0 4px;color:var(--muted);font-weight:700}
.extra p,.extra ul{margin:0}
.extra ul{padding-left:18px}
.extra a{color:var(--accent);word-break:break-all}
.headlines{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.headlines li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.headlines .n{font-family:var(--mono);font-size:12px;color:var(--seal)}
.headlines small{color:var(--muted);font-family:var(--mono);font-size:11px;display:block}
.next{padding:18px 20px;display:grid;gap:6px;border-top:3px solid var(--seal)}
.next .name{font-family:var(--display);font-weight:900;font-size:20px}
.cd{font-family:var(--mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal{padding:6px 0}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.4}
.ev .d b{display:block;color:var(--ink);font-size:14px;font-weight:500}
.ev .t{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .x{font-size:12px;color:var(--muted)}
.ev.past{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.high{background:var(--seal)}
.tbc{font-size:11px;color:var(--warn);font-weight:700}
.archive{display:grid;gap:0}
.arow{display:grid;grid-template-columns:110px 78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;font-weight:400;width:100%}
.arow:last-child{border-bottom:0}
.arow.on{background:var(--accent-soft)}
.arow .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.arow{grid-template-columns:86px minmax(0,1fr) auto}.arow .sl{display:none}}
.empty{padding:22px;color:var(--muted)}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mix div{display:grid;gap:4px;font-size:13px}
.mix .bar{height:6px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.mix .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.mix .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--seal)}
.mix .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0}
.bi{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:4px;min-width:0}
.bi h4{margin:0;font-size:15px;line-height:1.45}
.bi p{margin:0;font-size:13px}
.bi .why{color:var(--muted)}
.bi a{color:var(--accent);font-size:12px;word-break:break-all}
.bi.pick{background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted)}
.picks{display:grid;gap:18px}
.chip.lead{background:var(--ink);color:var(--surface)}
.chip.bad{background:var(--warn-soft);color:var(--seal)}
.vbox{display:grid;gap:6px;font-size:13px}
.vbox summary{cursor:pointer;font-weight:700;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:8px}
.vgrid dt{color:var(--muted)}.vgrid dd{margin:0}
.vbox ul{margin:4px 0 0;padding-left:18px}
.vbox a{color:var(--accent);word-break:break-all}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}
.preheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.panel{transition:border-color .2s}}

/* V2.1 additions: summary tiles, radar filters, story tracker, performance, tabs */
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin:0 0 10px}
.section-head .label{margin:0}
.stale{color:var(--seal);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{padding:14px 16px;display:grid;gap:2px}
.tile b{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin-top:12px}
.sched div{padding:10px 16px;border-right:1px solid var(--line);font-size:13px;display:grid;gap:2px}
.sched div:last-child{border-right:0}
@media (max-width:700px){.sched div{border-right:0;border-bottom:1px solid var(--line)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
select,input[type=text],input[type=search],input[type=url],input[type=number],input[type=datetime-local],textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0}
.radar{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bi .times{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bi .srcs{display:flex;flex-wrap:wrap;gap:4px 10px}
.bi.read{opacity:.6}
.newdot{width:7px;height:7px;border-radius:50%;background:var(--seal);display:inline-block}
.chip.lv-重大{background:var(--seal);color:var(--surface)}
.chip.lv-追蹤更新{background:var(--warn-soft);color:var(--warn)}
.chip.vf-官方確認{background:var(--ok-soft);color:var(--ok)}
.chip.vf-可靠媒體報導{background:var(--accent-soft);color:var(--accent)}
.chip.vf-待查證,.chip.vf-傳聞{background:var(--warn-soft);color:var(--seal)}
.mini{font-size:12px;padding:3px 9px}
.stories{border-top:1px solid var(--line)}
.stories summary{padding:12px 16px;cursor:pointer;font-weight:700}
.story{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:13px}
.story h4{margin:0;font-size:15px}
.story ul{margin:0;padding-left:18px}
.story a{color:var(--accent);word-break:break-all}
.picks3{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
@media (max-width:420px){.picks3{grid-template-columns:minmax(0,1fr)}}
.picks3 .body{max-width:none}
.chip.st-需要更新{background:var(--warn-soft);color:var(--seal)}
.perfform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.perfform label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.perfform .wide{grid-column:1/-1}
.perf{padding:16px 18px;display:grid;gap:18px}
.perf h3{font-size:13px;margin:0 0 6px;color:var(--muted)}
.perf table{border-collapse:collapse;width:100%;font-size:13px}
.perf th,.perf td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.perf td.n,.perf th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.perfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:10px 16px;background:none}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.fav{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px;font-size:13px}
.fav h4{margin:0;font-size:15px}
.fav a{color:var(--accent);word-break:break-all}
.evx{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.evx a{color:var(--accent)}
.evgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start}
@media (max-width:860px){.evgrid{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">纏</div>
      <div>
        <h1>纏道漫長 情報台</h1>
        <p class="sub">排程更新，非即時監控｜晨間 08:30・晚間 17:30・週日 19:30｜文章一律人工審核後才發布</p>
      </div>
    </div>
    <div class="clock">台灣時間<br><b id="now">--</b></div>
  </header>

  <section aria-labelledby="l-sum">
    <div class="section-head"><p class="label" id="l-sum">今日情報摘要</p><span class="meta" id="sumUpd"></span></div>
    <div class="tiles" id="tiles"></div>
    <div class="panel sched" id="sched"></div>
  </section>

  <section aria-labelledby="l-radar">
    <div class="section-head"><p class="label" id="l-radar">全球重大新聞雷達 <span id="briefDate" class="meta"></span></p><span class="meta" id="radarUpd"></span></div>
    <div class="panel">
      <div class="tabs" role="tablist" id="edTabs" aria-label="晨報或晚報"></div>
      <div class="filters">
        <div class="seg" id="fTime" role="group" aria-label="時間範圍">
          <button data-v="0" aria-pressed="true">全部</button><button data-v="1">1 小時</button><button data-v="3">3 小時</button><button data-v="6">6 小時</button><button data-v="24">24 小時</button>
        </div>
        <select id="fDomain" aria-label="類別"><option value="">全部類別</option></select>
        <select id="fSort" aria-label="排序"><option value="time">依時效</option><option value="level">依重要性</option><option value="score">依評分</option><option value="domain">依類別</option></select>
        <label class="note"><input type="checkbox" id="fUnread"> 只看未讀</label>
      </div>
      <div class="radar" id="brief"><div class="empty">讀取中…</div></div>
      <details class="stories" id="storiesBox"><summary>追蹤中的重大事件 <span class="meta" id="storyCount"></span></summary><div id="stories"></div></details>
    </div>
  </section>

  <section aria-labelledby="l-post">
    <div class="section-head"><p class="label" id="l-post">今日推薦發布 <span id="pickDate" class="meta"></span></p><span class="note">查證通過不等於已審核；審核與發布由你標記</span></div>
    <div class="picks3" id="post"><div class="panel empty">正在讀取文章…</div></div>
  </section>

  <section aria-labelledby="l-ev">
    <div class="section-head"><p class="label" id="l-ev">重大事件與經濟日曆（台灣時間）</p><span class="meta" id="calUpd"></span></div>
    <div class="evgrid">
      <div style="display:grid;gap:18px;min-width:0">
        <div class="panel next" id="next"><div class="note">讀取中…</div></div>
        <div style="display:grid;gap:18px" id="preheat"></div>
      </div>
      <div class="panel cal" id="cal"><div class="empty">讀取中…</div></div>
    </div>
  </section>

  <section aria-labelledby="l-perf">
    <div class="section-head"><p class="label" id="l-perf">Threads 成效分析</p><span class="note">數據由你手動輸入，未串接 Threads API</span></div>
    <div class="panel perf" id="perf"><div class="empty">讀取中…</div></div>
  </section>

  <section aria-labelledby="l-arc">
    <p class="label" id="l-arc">文章存檔與題材收藏庫</p>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabArc" aria-selected="true">文章存檔</button>
        <button role="tab" id="tabFav" aria-selected="false">題材收藏庫 <span id="favCount" class="meta"></span></button>
      </div>
      <div id="arcPane">
        <div class="filters">
          <input type="search" id="aq" placeholder="搜尋標題或內文" aria-label="搜尋文章">
          <select id="aDomain" aria-label="領域"><option value="">全部領域</option></select>
          <select id="aSlot" aria-label="時段"><option value="">全部時段</option><option value="主文">晨間</option><option value="晚間">晚間</option><option value="事件">事件預熱／公布後</option></select>
          <select id="aStatus" aria-label="狀態"><option value="">全部狀態</option><option>待審</option><option>已審核</option><option>已發布</option><option>需要更新</option></select>
        </div>
        <div id="detail" hidden style="padding:16px"></div>
        <div class="archive" id="archive"><div class="empty">讀取中…</div></div>
      </div>
      <div id="favPane" hidden><div id="favs"><div class="empty">讀取中…</div></div></div>
    </div>
  </section>
  <p class="note" id="sync"></p>
</div>

n": "美股、美債、美元與金融機構", "summary": "CNBC（11/10 更新 16:06 ET）：2 年期升逾 18bp 至 4.736%、10 年期升 13bp 至 4.992%，盤中一度站上 5%；S&P 500 收跌 0.38%", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "ust-yields-1110：2 年期 4.70%、10 年期 4.94% 與 5% 關卡；S&P 500 -0.38%", "article": "CPI 公布後，股市反應其實不算大，S&P 500 只跌了 0.38%，但債市直接動起來。\n⠀⠀\n2 年期美債殖利率一天跳了超過 18 個基點到 4.74%，10 年期也升到 4.99%，盤中還一度站上 5%。2 年期對升息預期最敏感，這個跳幅等於市場把 12 月升息押得更滿。\n⠀⠀\n股市還在消化，債市已經先表態了，10 年期能不能站穩 5%，可能會是接下來更大的壓力測試。", "level": "追蹤更新", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T10:06:16Z", "sources": [{"label": "CNBC：CPI 後殖利率跳升（11/10）", "url": "https://www.cnbc.com/2026/11/10/us-bonds-treasurys-yields.html"}, {"label": "TheStreet：11/10 美股收盤", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-10-2026"}], "storyId": "ust-2026-11", "score": 20, "isNew": true, "picked": true}, {"title": "軟銀虧 70 億美元，股價卻先漲", "domain": "企業併購、IPO、破產、裁員", "summary": "CNBC、Reuters：淨虧 1.12 兆日圓、去年同期賺 2.5 兆；發電設備損失約 37 億美元；股價收漲 13.9%（Reuters 稱在財報前）", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "softbank-q2-1110：淨利去年同期 +2.5 兆 vs 本季 -1.12 兆日圓；股價 +13.9%；發電設備損失約 37 億美元", "article": "軟銀昨天交出一份很矛盾的財報。\n⠀⠀\n上一季虧了 1.12 兆日圓，大約 70 億美元，去年同期還賺 2.5 兆。光是美國 AI 資料中心的發電設備採購計畫改變，就認列了約 37 億美元損失。\n⠀⠀\n但股價在財報公布前已經先漲了 13.9%，市場看起來更在意 AI 股回溫，這一季的虧損反而被放在後面。\n⠀⠀\n接下來要看的是，這筆虧損是一次性的，還是會繼續擴大。", "level": "一般", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T09:50:47Z", "sources": [{"label": "CNBC：軟銀季虧 70 億美元（11/10）", "url": "https://www.cnbc.com/2026/11/10/softbank-2q-earnings-tech-selloff.html"}, {"label": "Reuters（AOL）（11/10）", "url": "https://www.aol.com/articles/softbank-swings-7-billion-net-063725000.html"}], "storyId": "softbank-2026-11", "score": 19, "isNew": true, "picked": true}, {"title": "布蘭特原油，不到兩週少了兩成", "domain": "能源與原物料", "summary": "Reuters：10/30 半年高點約 118 美元、11/9 收 92.57；CNBC：11/10 布蘭特收 91.49；AP：盧比歐稱談判不太有成效", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "brent-1110：10/30 高點 118、11/09 92.57、11/10 約 90", "article": "油價這兩週的變化，我覺得比很多人想像的還大。\n⠀⠀\n布蘭特原油 10/30 還在 118 美元的半年高點，11/10 收在 91.5 美元左右，不到兩週少了兩成多。主要是川普說暫時不再對伊朗動武，市場開始交易停火的可能。\n⠀⠀\n但美國國務卿盧比歐也說，和伊朗的談判目前沒什麼成效。油價已經先跑在外交前面，萬一談判卡住，這段跌幅也可能很快被拉回去。", "level": "一般", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T10:06:16Z", "sources": [{"label": "Reuters（Investing.com）：油價續跌", "url": "https://www.investing.com/news/commodities-news/oil-falls-as-trump-downplays-prospect-of-escalation-with-iran-5013892"}, {"label": "AP（ABC News）：盧比歐談伊朗", "url": "https://abcnews.com/International/wireStory/rubio-discuss-iran-ukraine-ai-g7-allies-france-137965744"}], "storyId": "brent-2026-11", "score": 19, "isNew": true, "picked": true}, {"title": "AI 要電，核電股財報先交卷", "domain": "能源與原物料", "summary": "公司財報：調整後 EPS 5.06（去年 3.04），營收 95.5 億美元，第二次上調 2026 財測；預期 3.89（Fiscal AI）；盤中漲幅 4%～5.6%（多家報導）", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "ceg-q3-1109：EPS 實際 5.06 vs 預期 3.90；股價 +10.5%；營收 95.5 億美元", "article": "AI 熱潮裡，有一個族群的財報最近很亮眼，就是賣電的公司。\n⠀⠀\n美國核電業者 Constellation Energy 週一公布第三季財報，調整後每股盈餘 5.06 美元，市場原本預期約 3.9 美元，還是今年第二次上調全年財測，股價盤中漲超過 4%。\n⠀⠀\nAI 資料中心需要大量穩定的電力，比起晶片股最近的大起大落，電力股比較少人在討論，但數字已經先反映出來了。", "level": "一般", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T10:06:16Z", "sources": [{"label": "Zacks（Yahoo Finance）：11/10 股市新聞", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-news-nov-10-094800346.html"}], "storyId": "ceg-2026-11", "score": 19, "isNew": true, "picked": true}, {"title": "MARA 六週賣掉四成 BTC", "domain": "加密貨幣與監管", "summary": "MARA Q3 股東信：9 月後約六週賣出 13,597 BTC、約 11 億美元、均價約 81,039，占 9 月底持有 34,012 BTC 的 40%；還款 7.5 億美元；計畫續賣", "why": "TG 機器人題材＋查證，附中文 16:9 配圖", "latest": "mara-sell-1110", "article": "礦工也開始賣幣了，而且賣得不少。\n⠀⠀\n比特幣礦企 MARA 九月之後大約六週，賣了 13,597 顆 BTC，換到約 11 億美元，是它九月底持幣的四成，平均賣價約 8.1 萬美元。\n⠀⠀\n這筆錢主要拿去還以 BTC 擔保的借款，接下來還要投入 AI 資料中心，它也說之後會繼續賣。\n⠀⠀\n比起散戶在想要不要抄底，我更在意這些手上有大量 BTC 的公司，是不是正在把幣換成現金。", "level": "一般", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T10:02:51Z", "sources": [{"label": "CoinDesk：MARA 六週賣出 13,597 BTC（11/10）", "url": "https:/ 動比較大的幣通常會先被賣，所以比起 BTC 還能撐多久，我現在更在意 ETH 會不會先失速。", "level": "追蹤更新", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T09:47:24Z", "sources": [{"label": "CoinGecko：ETH 價格", "url": "https://www.coingecko.com/en/coins/ethereum"}, {"label": "CoinGecko：BTC 價格", "url": "https://www.coingecko.com/en/coins/bitcoin"}], "storyId": "eth-btc-2026-11", "score": 20, "isNew": true, "picked": true}, {"title": "CPI 後，債市比股市先表態", "domain": "美股、美債、美元與金融機構", "summary": "CNBC（11/10 更新 16:06 ET）：2 年期升逾 18bp 至 4.736%、10 年期升 13bp 至 4.992%，盤中一度站上 5%；S&P 500 收跌 0.38%", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "ust-yields-1110：2 年期 4.70%、10 年期 4.94% 與 5% 關卡；S&P 500 -0.38%", "article": "CPI 公布後，股市反應其實不算大，S&P 500 只跌了 0.38%，但債市直接動起來。\n⠀⠀\n2 年期美債殖利率一天跳了超過 18 個基點到 4.74%，10 年期也升到 4.99%，盤中還一度站上 5%。2 年期對升息預期最敏感，這個跳幅等於市場把 12 月升息押得更滿。\n⠀⠀\n股市還在消化，債市已經先表態了，10 年期能不能站穩 5%，可能會是接下來更大的壓力測試。", "level": "追蹤更新", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T10:06:16Z", "sources": [{"label": "CNBC：CPI 後殖利率跳升（11/10）", "url": "https://www.cnbc.com/2026/11/10/us-bonds-treasurys-yields.html"}, {"label": "TheStreet：11/10 美股收盤", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-10-2026"}], "storyId": "ust-2026-11", "score": 20, "isNew": true, "picked": true}, {"title": "軟銀虧 70 億美元，股價卻先漲", "domain": "企業併購、IPO、破產、裁員", "summary": "CNBC、Reuters：淨虧 1.12 兆日圓、去年同期賺 2.5 兆；發電設備損失約 37 億美元；股價收漲 13.9%（Reuters 稱在財報前）", "why": "使用者風格的晚間市場文，附中文 16:9 配圖", "latest": "softbank-q2-1110：淨利去年同期 +2.5 兆 vs 本季 -1.12 兆日圓；股價 +13.9%；發電設備損失約 37 億美元", "article": "軟銀昨天交出一份很矛盾的財報。\n⠀⠀\n上一季虧了 1.12 兆日圓，大約 70 億美元，去年同期還賺 2.5 兆。光是美國 AI 資料中心的發電設備採購計畫改變，就認列了約 37 億美元損失。\n⠀⠀\n但股價在財報公布前已經先漲了 13.9%，市場看起來更在意 AI 股回溫，這一季的虧損反而被放在後面。\n⠀⠀\n接下來要看的是，這筆虧損是一次性的，還是會繼續擴大。", "level": "一般", "verifyLevel": "可靠媒體報導", "updatedAt": "2026-11-11T09:50:47Z", "sources": [{"label": "CNBC：軟銀季虧 70 億美元（11/10）", "url": "https://www.cnbc.com/2026/11/10/softbank-2q-earnings-tech-selloff.html"}, {"label": "Reuters（AOL）（11/10）", //securityweek.com/revolve-puts-data-breach-victim-count-at-1-5-million"}], "storyId": "revolve-breach", "summary": "Revolve 向印第安納州檢察長通報，10 月揭露的外洩事件影響 1,515,073 人，駭客 9/11 入侵包含電商平台在內的系統。", "title": "Revolve 資料外洩確認影響 151 萬人", "updatedAt": "2026-11-10T09:49:19Z", "verifyLevel": "可靠媒體報導", "why": "入侵、揭露到確認人數各隔一個月。"}], "updatedAt": "2026-11-10T09:49:19Z", "id": "2026-11-10-pm"}, {"date": "2026-11-10", "edition": "晨報", "items": [{"article": "上個月法國幾百家超市的冷凍櫃被駭，整晚升溫，食物整批報廢。昨天法國外長正式點名，說是伊朗革命衛隊幹的，還召見了伊朗大使。\n\n法國說這是本土第一起大規模的破壞型網攻，被鎖定的點大約 700 個，光 Intermarché 就有 180 家店冷藏溫度整晚降不下來，業者估計損失數千萬歐元。伊朗還沒回應。以前講網攻多半是資料外洩，這次是讓你家附近超市的肉直接壞掉。", "domain": "科技監管、資安與詐騙", "isNew": false, "latest": "伊朗未回應；歐盟稱回應應強硬。", "level": "追蹤更新", "picked": true, "score": {"credibility": 5, "discussion": 5, "importance": 4, "timeliness": 5, "total": 23, "value": 4}, "sources": [{"label": "France 24（11/9）", "url": "https://www.france24.com/en/europe/20261109-iran-revolutionary-guards-behind-cyberattacks-on-supermarket-fridges-says-french-fm-barrot"}, {"label": "Reuters via US News（11/9）", "url": "https://www.usnews.com/news/world/articles/2026-11-09/exclusive-french-officials-suspect-iran-is-behind-refrigerator-hacks-sources-say"}, {"label": "NBC News（11/9）", "url": "https://www.nbcnews.com/world/france/france-supermarket-cyberattacks-iran-revolutionary-guard-corps-accused-rcna608354"}], "storyId": "eu-fridge-cyberattack", "summary": "外長 Barrot 稱 10/11–12 的攻擊是伊朗所為，召見伊朗大使；Intermarché 約 180 家店冷藏整晚高溫。", "title": "法國點名伊朗革命衛隊，駭了全國約 700 處超市冷凍櫃", "updatedAt": "2026-11-10T00:39:40Z", "verifyLevel": "官方確認", "why": "網攻從偷資料變成讓超市的肉壞掉，而且是國家級行為。"}, {"article": "昨晚美股大漲，S&P 500 漲 2.35%，是 4 月以來最好的一天，AMD 漲 13%，Broadcom 漲近 9%。偏偏 Nvidia 逆勢跌了 4.3%，收在 178.67 美元。\n\n上週市場把 AI 晶片當成一籃子一起賣，昨天開始分開看了。同一天，AMD 和 Nvidia 差了 17 個百分點，差別主要在一個人身上。11/17 財報之前，Nvidia 的股價大概很難只看基本面。", "domain": "美國股市、美債、美元與金融機構", "isNew": true, "level": "重大", "picked": true, "score": {"credibility": 4, "discussion": 4, "importance": 4, "timeliness": 5, "total": 21, "value" eading-for-a-fifth-straight-losing-week-what-followed-the-last-time-it-lost-five-in-a-row/"}, {"label": "Investing.com Live：BTC 亞洲盤跌破 7.5 萬（11/9）", "url": "https://investinglive.com/cryptocurrency/bitcoin-continues-to-trade-heavily-under-74-600-risk-mood-turns-wary/"}, {"label": "Farside BTC ETF 流向", "url": "https://farside.co.uk/btc/"}], "status": "已發布", "storyId": "btc-losing-streak", "title": "BTC 連續第五週收黑：連跌週數不太能拿來抓底", "verify": {"eventDate": "週線收盤 2026/11/9 08:00 台北", "facts": "2022/5/29 約 29,446 → 6/26 約 21,029；2026/3/1 約 65,769 → 3/29 約 65,957，6/30 收 58,566 為一年最低；歷史高點 126,080。", "opinion": "「連跌週數不能當見底訊號」「觀察更高的低點」為作者觀點。", "status": "可發布", "unconfirmed": ["週線正式收盤價未取得，依亞洲盤約 74,500 判斷低於週開盤 78,232；文中未寫收盤價"], "updatedAt": "11/9 亞洲盤（Investing.com Live）"}, "id": "2026-11-09-btc-five-week-streak"}, {"body": "中國 10 月 PPI 年增 5.7%，是 2022 年 6 月以來最高，比預期的 5.3% 還熱。同一份數據裡，CPI 只有 0.7%，比上個月的 0.9% 還低。\n\n工廠端在漲、消費端卻降溫，漲價主要來自礦業和原材料，看起來成本還沒傳到終端消費。這幾年市場習慣說中國在出口通縮，用便宜的貨把全球物價往下壓。如果出廠價繼續往上走，這個說法可能得改寫了。", "checkedAt": "11/9 17:34 台灣", "comment": "中國核心 CPI 也從 1% 降到 0.8%，內需偏弱這件事沒有因為 PPI 轉熱而改變。", "createdAt": "2026-11-09T09:35:00Z", "date": "2026-11-09", "domain": "全球經濟與央行", "publishAt": "11/9 晚上 19:00–22:00", "reason": "早上三篇沒有總經；中國出廠價轉熱是反直覺的新數據，又在美國 CPI 前一天。", "score": {"credibility": 4, "discussion": 3, "importance": 4, "timeliness": 5, "total": 21, "value": 5}, "slot": "晚間", "sources": [{"label": "CNBC：中國批發物價四年多最高（11/9）", "url": "https://www.cnbc.com/2026/11/09/china-wholesale-inflation-rises-consumer.html"}], "status": "待審", "storyId": "china-inflation-2026-10", "title": "中國出廠價年增 5.7%，消費端卻降溫", "verify": {"eventDate": "2026/11/9（中國國家統計局公布）", "facts": "PPI 年增 5.7%（Reuters 調查預期 5.3%），2022/6 以來最高；CPI 0.7%（預期 0.8%、前值 0.9%）；核心 CPI 0.8%；主因礦業與原材料。", "opinion": "「成本還沒傳到終端」「出口通縮說法可能改寫」為作者推論。", "status": "可發布", "unconfirmed": ["未對國家統計局原始新聞稿", "出口價格是否同步上升尚無數據佐證"], "updatedAt": "11/9 CNBC"}, "id": "2026-11-09-china-ppi"}, {"body": "Nvidia 董事會週日宣布，由獨立董事帶外部律師調查黃仁勳。起因是報導指他遭外國情報單位鎖定，他也在員工信裡承認了婚外情。董事會說，沒有理由認為國安或公司機密外洩。\n\n時間點很尷尬，財報 11/17 就要公布，上週晶片股才剛重摔。黃仁勳 1993 年創辦公司帶到現在，市場對 Nvidia 的信心，有一部分是對他的信心。這種風險平常很少人算，調查出結果前，只能各自猜要打幾折。", "checkedAt": "11/9 08:55 台北", "comment": "董事會找的是獨立董事加外部律師，這算比較正式的做法，結果出來前，公開的細節大概不會太多。", "createdAt": "2026-11-09T00:55:00Z", "date": "2026-11-09", "domain": "AI 產業", "doubts": ["「被外國情報單位鎖定」是報導與政策制定者的指控，NBC 表示尚未證實；文中寫成「報導指」", "美股 11/9 開盤前無股價反應資料，文中未提股價"], "pick": "首選", "publishAt": "11/9 上午或美股開盤前（21:00 前）", "published": {"at": null, "body": "Nvidia 董事會週日宣布，由獨立董事帶外部律師調查黃仁勳。起因是報導指他遭外國情報單位鎖定，他也在員工信裡承認了婚外情。董事會說，沒有理由認為國安或公司機密外洩。\n\n時間點很尷尬，財報 11/17 就要公布，上週晶片股才剛重摔。黃仁勳 1993 年創辦公司帶到現在，市場對 Nvidia 的信心，有一部分是對他的信心。這種風險平常很少人算，調查出結果前，只能各自猜要打幾折。", "comment": "董事會找的是獨立董事加外部律師，這算比較正式的做法，結果出來前，公開的細節大概不會太多。", "note": "升級前已標記發布，標記時間未記錄"}, "reason": "財報前九天、全球市值最大公司之一的創辦人風險，時效與討論度最高。", "score": {"credibility": 4, "discussion": 5, "importance": 5, "timeliness": 5, "total": 23, "value": 4}, "slot": "主文", "sources": [{"label": "Nvidia 董事會聲明", "url": "https://nvidianews.nvidia.com/news/statement-from-nvidia-board-of-directors"}, {"label": "CNBC：黃仁勳員工信與董事會聲明（11/8）", "url": "https://www.cnbc.com/2026/11/08/nvidia-jensen-huang-email-board-of-directors-statement.html"}, {"label": "CNN：Nvidia 啟動調查（11/8）", "url": "https://www.cnn.com/2026/11/08/business/nvidia-investigation-ceo-jensen-huang"}, {"label": "NBC News：未證實情報指控（11/8）", "url": "https://www.nbcnews.com/tech/tech-news/nvidia-ceo-jensen-huang-investigation-rcna608148"}, {"label": "Schwab：11/5 晶片股下跌", "url": "https://www.schwab.com/learn/story/market-volatility"}], "status": "已發布", "storyId": "nvidia-ceo-probe", "title": "Nvidia 調查黃仁勳：財報前九天的創辦人風險", "verify": {"eventDate": "2026/11/8（美東週日）", "facts": "董事會成立獨立董事委員會加外部律師調查；黃仁勳員工信承認婚外情；董事會稱無理由認為國安或機密外洩；財報 11/17。", "opinion": "「市場信心有一部分是對他的信心」「打幾折」為作者觀點。", "status": "可發布", "unconfirmed": ["「遭外國情報單位鎖定」是報導與政策制定者的指控，NBC 表示尚未證實（文中已寫成「報導指」）", "股價反應需等美股 11/9 開盤"], "updatedAt": "11/8 16:50 ET（CNBC 全文刊登）"}, "id": "2026-11-09-nvidia-ceo-probe"}, {"body": "週二晚上 9:30 的 CPI 有點怪。去年 10 月政府停擺沒收到物價，這次整體跟核心都不給年增率，只有月增。偏偏這又是 12 月 Fed 開會前最後一份 CPI。\n\n所以重點就看核心月增。0.3% 換算一年大約 3.7%，0.2% 大約 2.4%。利率期貨押的升息機率已經七成以上，數字偏熱市場不太意外，真的冷下來反而比較容易讓行情動起來。", "category": "總經時事", "chart": "月增率換算年化對照卡（0.2%→2.4%、0.3%→3.7%、0.4%→4.9%），旁邊放 9 月 CPI 拆解：整體年增 3.7%、核心 2.6%、汽油 34.2%。來源：BLS CPI 新聞稿；年化以 (1+m)^12−1 計算。", "checkedAt": "11/9 01:20 台北（改寫 11/9）", "comment": "汽油、新車、二手車這幾項還是有年增率，想知道物價壓力從哪來，可以先看這三項。", "createdAt": "2026-11-08T17:30:00Z", "date": "2026-11-09", "domain": "全球經濟與央行", "doubts": ["12 月升息隱含機率各家不一（65%／77%／80%），讀取時間與來源不同，文章寫「七成以上」", "核心 CPI 共識 0.2% 與 0.3% 並存，文章寫成區間"], "headlines": [{"asof": "11/8 20:20 台北，週收 11/9 08:00", "text": "BTC 測試 50 週均線（約 $75,562），週線若收在 $78,239 下方即連續第五週收黑"}, {"asof": "11/2–11/6，Farside", "text": "現貨 BTC ETF 上週淨流出約 12.8 億美元，IBIT 約 12.1 億美元"}, {"asof": "BLS FAQ，頁面更新 2026/9/16", "text": "10 月 CPI 11/10 21:30 公布，整體與核心不公布年增率"}], "publishAt": "11/9 20:00–21:30", "slot": "預熱", "sources": [{"label": "BLS：2025 停擺對 CPI 影響 FAQ", "url": "https://www.bls.gov/cpi/additional-resources/2025-federal-government-shutdown-impact-cpi-faq.htm"}, {"label": "StockTitan：10 月 CPI 預覽（11/6）", "url": "https://www.stocktitan.net/articles/october-2026-cpi-preview-no-yearly-rate"}, {"label": "BigGo：CPI 共識（11/7）", "url": "https://finance.biggo.com/news/9e1d0a9b-b32c-4bf1-b265-11480691d264"}, {"label": "24/7 Wall St.：FedWatch 76.8%", "url": "https://247wallst.com/investing/2026/11/07/odds-of-a-december-rate-hike-jump-to-77-after-a-blowout-jobs-report/"}, {"label": "Farside BTC ETF 流向", "url": "https://farside.co.uk/btc/"}, {"label": "Stocktwits：BTC 週線與 50 週均線", "url": "https://stocktwits.com/news-articles/markets/cryptocurrency/bitcoin-slips-toward-week-moving-average-weekly-close-hangs-balance/cNGVKPER9Ig"}], "status": "待審", "title": "這次 CPI 沒有年增率，只看核心月增", "id": "2026-11-09-preheat-cpi"}, {"body": "馬斯克上週五在 X 上丟了一句「軟銀的渦輪訂單違約了」，沒附任何證據。當天軟銀在東京跌了 10.8%，5 年期 CDS 擴大到 2022 年 10 月以來最寬，今天又再跌 4.2%。\n\n軟銀到週末都沒回應，財報明天公布。它為了 OpenAI 約 13% 股權砸了 646 億美元，6 月底的淨有息負債是 10.8 兆日圓，一年前才 6.6 兆。一句沒證據的話能讓市場這麼緊張，說明大家本來就在擔心它的槓桿。", "checkedAt": "11/9 17:50 台灣", "comment": "CDS 可以想成替軟銀的債買保險的價格，價格越高，代表市場越擔心它還不出錢。", "createdAt": "2026-11-09T09:49:10Z", "date": "2026-11-09", "domain": "富豪與商業人物", "publishAt": "11/9 晚上 20:00–23:00（財報前）", "reason": "有人物、有反常反應、明天就有財報，比中國 PPI 更有討論度。", "score": {"credibility": 4, "discussion": 5, "importance": 4, "timeliness": 5, "total": 22, "value": 4}, "slot": "晚間", "sources": [{"label": "Yahoo Finance：馬斯克指控與軟銀下跌", "url": "https://finance.yahoo.com/markets/stocks/articles/elon-musk-claims-softbank-defaulting-144048810.html"}, {"label": "AOL（Reuters）：財報前、負債與 OpenAI 持股", "url": "https://www.aol.com/articles/softbank-face-scrutiny-ai-strategy-080330000.html"}, {"label": "TradingKey：11/9 日韓收盤", "url": "https://www.tradingkey.com/analysis/stocks/more/262295531-japan-korea-stocks-skhy-kospi-nikkei-samsung-skhynix-softbank-kioxia-nvda-sox-cpi-ppi-tradingkey"}], "status": "需要更新", "storyId": "softbank-musk-turbine", "title": "馬斯克一句話，軟銀跌一成", "updateNote": "軟銀 11/10 已公布財報（季虧約 70 億美元），文中「財報明天公布」已過時；可改發 11/10 晚間文章「軟銀虧 70 億美元，財報前股價先漲 14%」。", "verify": {"eventDate": "2026/11/6（馬斯克發文、軟銀下跌）；11/9 再跌 4.2%", "facts": "11/6 東京收跌 10.83%；5 年期 CDS 升 22 基點至 466，2022/10 以來最寬；OpenAI 約 13% 股權投入 646 億美元；6 月底淨有息負債 10.8 兆日圓（一年前 6.6 兆）；財報 11/10。", "opinion": "「說明大家本來就在擔心它的槓桿」為作者推論。", "status": "可發布", "unconfirmed": ["馬斯克的違約說法未經證實，軟銀與渦輪廠商截至週末未回應（文中已寫明沒附證據）", "11/9 跌 4.2% 來源為 TradingKey，未對東證官方資料"], "updatedAt": "11/9 亞洲收盤"}, "id": "2026-11-09-softbank-musk"}, {"body": "今晚 CPI 出來，整體月增 0.4%、核心 0.3%，兩個都比預期多一格。核心已經連續三個月都是 0.3%，換算一年大約 3.7%。\n\n巧的是，Fed 理事 Waller 今天稍早才說，核心如果到 0.3% 以上，12 月可能要升兩碼。數字公布後，2 年期美債殖利率跳升超過 15 個基點，BTC 也跌破 7.4 萬。市場原本在吵升不升，現在變成在猜升多少。", "checkedAt": "2026-11-10T13:53:02Z", "comment": "這次 BLS 沒有公布年增率，網路上看到的「年增幾 %」都是媒體自己推估的數字。", "createdAt": "2026-11-10T13:53:02Z", "date": "2026-11-10", "domain": "全球經濟與央行", "publishAt": "11/10 22:00–23:30", "reason": "實際值超預期，又剛好對上 Waller 的門檻", "score": 23, "slot": "公布後", "sources": [{"label": "BLS：CPI 2026 年 10 月新聞稿", "url": "https: 格，公司估接受率低於 5%；納德拉 6 月在 Possible podcast 提到 2000 萬個代理。", "opinion": "結尾一句為編輯觀點", "status": "可發布", "unconfirmed": ["微軟稱方案與 AI 無關，無法驗證實際動機"], "updatedAt": "2026-11-10T02:14:20Z"}, "id": "2026-11-10-extra-msft-exit"}, {"body": "幣安 10/29 被盜約 63 億美元，FBI 指向北韓駭客集團 TraderTraitor。分析公司 Elliptic 週一說，他們在 NEAR 鏈上 3 天內自己發了 6 個迷因幣，一個成本才 90 美元左右。\n\n做法是開一個流動性池，一組錢包拿贓款買幣，另一組再把幣賣回池子，換走乾淨的資產。兩邊沒有直接轉帳，追查就多卡一層。這次只洗了約 43 萬美元，看起來比較像在測試這條路。", "checkedAt": "2026-11-10T02:14:20Z", "comment": "Elliptic 說同樣手法在 2025 年 Bybit 被駭後就出現過，當時用的是 Tron 鏈上的垃圾幣。", "createdAt": "2026-11-10T02:14:20Z", "date": "2026-11-10", "domain": "加密貨幣與監管", "reason": "洗錢手法新奇，數字反差大", "slot": "加碼", "sources": [{"label": "Bitcoin Magazine：北韓自製迷因幣洗幣安贓款（11/9）", "url": "https://bitcoinmagazine.com/news/north-korea-meme-coins-binance-hack"}], "status": "待審", "storyId": "nk-memecoin", "title": "北韓開始自己發迷因幣來洗錢", "verify": {"eventDate": "2026-11-09", "facts": "幣安 10/29 被盜約 63.4 億美元；FBI 歸因 TraderTraitor；Elliptic 11/9 指 11/5～7 在 NEAR 上發 6 個代幣，洗約 43 萬美元。", "opinion": "結尾一句為編輯觀點", "status": "可發布", "unconfirmed": ["北韓官方否認涉案", "被盜總額各家數字略有出入"], "updatedAt": "2026-11-10T02:14:20Z"}, "id": "2026-11-10-extra-nk-memecoin"}, {"body": "巴拉圭的 Ueno 銀行號稱全國六成以上成年人都是它的客戶，11/3 被央行接管，App、卡片、轉帳一夕全停。兩天後總統 Peña 在 X 上宣布辭職，幾分鐘後眾議院 78 比 0 通過彈劾。\n\n問題出在關係太近。Peña 任命 Ueno 集團旗下公司的負責人去當央行總裁，等於讓對方管自己；上個月他還說外界質疑是抹黑。現在 6 名高層被羈押，瓜拉尼一週跌了近 7%。", "checkedAt": "2026-11-10T02:14:20Z", "comment": "存款保險每人保到約 3.6 萬美元，央行估計 97% 客戶的存款能全額拿回。", "createdAt": "2026-11-10T02:14:20Z", "date": "2026-11-10", "domain": "全球政治與地緣", "reason": "銀行倒閉直接拉下總統，題材少見又好懂", "slot": "加碼", "sources": [{"label": "AP（NPR 轉載）：巴拉圭總統辭職後隨即遭彈劾（11/5）", "url": "https://www.stlpr.org/npr/2026-11-05/paraguays-president-is-impeached-minutes-after-resigning-following-a-bank-collapse"}], "status": "待審", "storyId": "paraguay", "title": "一家銀行倒閉，把巴拉圭總統拉下台", "verify": {"eventDate": "2026-11-05", "facts": "Ueno 銀行 11/3 遭央行接管；Peña 11/5 辭職，眾議院 78-0 彈劾；6 名高層羈押、27 人被起訴；瓜拉尼一週跌近 7%。", "opinion": "結尾一句為編輯觀點", "status": "可發布", "unconfirmed": ["Peña 是否會被起訴與羈押尚未確定"], "updatedAt": "2026-11-10T02:14:20Z"}, "id": "2026-11-10-extra-paraguay"}, {"body": "Saylor 的 Strategy 上週又買了 1,036 顆 BTC，總持有 850,364 顆。同一週，它花了 1.88 億美元買回自家 STRC 優先股，是買幣金額的兩倍多。\n\n它全部持幣的平均成本是 75,456 美元，BTC 這兩天在 7.4 萬上下，帳面已經跌破成本。買幣的錢來自賣普通股，買回優先股動用的是美元準備金。公司沒說為什麼要買回，但錢往哪邊花得多，市場自己會解讀。", "checkedAt": "2026-11-10T05:57:11Z", "comment": "Strategy 帳上美元準備金約 47.7 億美元，這筆錢原本是拿來付優先股股息的緩衝。", "createdAt": "2026-11-10T05:57:11Z", "date": "2026-11-10", "domain": "加密貨幣與監管", "reason": "最大持幣公司資金動向反常", "slot": "加碼", "sources": [{"label": "The Block：Strategy 再買 1,036 顆 BTC（11/9）", "url": "https://www.theblock.co/news/business/2026-11-09-connecting-the-dots-michael-saylor-strategy-bitcoin-436094"}], "status": "待審", "storyId": "strategy-buyback", "title": "Strategy 買幣 8,200 萬，買回自家優先股花了 1.88 億", "verify": {"eventDate": "2026-11-09", "facts": "11/2～11/8 買 1,036 BTC 約 8,190 萬美元；買回 1,887,464 股 STRC 約 1.883 億美元；平均成本 75,456 美元。", "opinion": "結尾一句為編輯觀點", "status": "可發布", "unconfirmed": ["買回 STRC 的原因公司未說明"], "updatedAt": "2026-11-10T05:57:11Z"}, "id": "2026-11-10-extra-strategy-buyback"}, {"body": "川普迷因幣 11/8 跌到 1.12 美元，歷史新低。2025 年 1 月發行第二天，它最高衝到 73.43 美元。期中選舉民主黨拿下參眾兩院後，它一天跌了 17%，一週跌掉三成。\n\n更妙的是，持幣量前 185 名的錢包，11/22 可以跟川普吃晚餐，排名算到 11/12。換句話說，現在還硬抱著的大戶，有一部分是在等這頓飯。排名一截止，他們抱著的理由就少了一個。", "checkedAt": "2026-11-10T05:57:11Z", "comment": "目前流通約 2.8 億顆，總量 10 億顆，其餘大多在川普相關公司手上，按三年時程解鎖。", "createdAt": "2026-11-10T05:57:11Z", "date": "2026-11-10", "domain": "加密貨幣與監管", "reason": "名人幣暴跌加晚餐門票，話題性高", "slot": "加碼", "sources": [{"label": "24/7 Wall St.：TRUMP 幣創歷史新低（11/9）", "url": "https://247wallst.com/investing/cryptocurrency/2026/11/09/the-trump-coin-just-hit-an-all-time-low-down-98-from-its-peak-will-trump-coin-ever-go-back-up/"}], "status": "待審", "storyId": "trump-coin", "title": "TRUMP 幣跌到 1.12 美元，離高點少了 98%", "verify": {"eventDate": "2026-11-08", "facts": "TRUMP 11/8 低點 1.12 美元，高點 73.43 美元（2025/1/19）；選後單日跌 17%；前 185 名晚餐 11/22，排名 11/12 截止。", "opinion": "結尾一句為編輯觀點", "status": "可發布", "unconfirmed": ["大戶是否為晚餐持幣屬推論"], "updatedAt": "2026-11-10T05:57:11Z"}, "id": "2026-11-10-extra-trump-coin"}, {"body": "上個月法國幾百家超市的冷凍櫃被駭，整晚升溫，食物整批報廢。昨天法國外長正式點名，說是伊朗革命衛隊幹的，還召見了伊朗大使。\n\n法國說這是本土第一起大規模的破壞型網攻，被鎖定的點大約 700 個，光 Intermarché 就有 180 家店冷藏溫度整晚降不下來，業者估計損失數千萬歐元。伊朗還沒回應。以前講網攻多半是資料外洩，這次是讓你家附近超市的肉直接壞掉。", "checkedAt": "11/10 08:45 台灣", "comment": "法國用的是 IP 追蹤和攻擊手法比對，Reuters 沒能確認細節。歐盟外交主管說回應「應該要強硬」。", "createdAt": "2026-11-10T00:39:40Z", "date": "2026-11-10", "domain": "科技監管、資安與詐騙", "pick": "首選", "publishAt": "11/10 中午或晚上", "reason": "昨天晚報還是「找不到攻擊者」，今天官方點名伊朗，有反轉又有畫面感。", "score": {"credibility": 5, "discussion": 5, "importance": 4, "timeliness": 5, "total": 23, "value": 4}, "slot": "主文", "sources": [{"label": "France 24（11/9）", "url": "https://www.france24.com/en/europe/20261109-iran-revolutionary-guards-behind-cyberattacks-on-supermarket-fridges-says-french-fm-barrot"}, {"label": "Reuters via US News（11/9）", "url": "https://www.usnews.com/news/world/articles/2026-11-09/exclusive-french-officials-suspect-iran-is-behind-refrigerator-hacks-sources-say"}, {"label": "NBC News（11/9）", "url": "https://www.nbcnews.com/world/france/france-supermarket-cyberattacks-iran-revolutionary-guard-corps-accused-rcna608354"}], "status": "待審", "storyId": "eu-fridge-cyberattack", "title": "法國點名伊朗：超市冷凍櫃是被革命衛隊駭的", "verify": {"eventDate": "攻擊 2026/10/11–12；法國點名 11/9", "facts": "法國外長 Barrot 稱 10/11–12 攻擊由伊朗革命衛隊發動、約 700 個點遭鎖定、召見伊朗大使；Intermarché 母公司稱約 180 家店冷藏整晚高溫，估計全國損失數千萬歐元。", "opinion": "最後一句為作者觀點。", "status": "可發布", "unconfirmed": ["法國歸因的完整證據未公開，Reuters 無法確認法國如何得出結論", "伊朗尚未回應"], "updatedAt": "11/9 France 24、Reuters、NBC"}, "id": "2026-11-10-france-iran-fridge"}, {"body": "FDA 昨天要求所有 GLP-1 藥物加上新警語，包括 Ozempic 和 Zepbound，提醒可能引發一種罕見的視神經病變 NAION，嚴重時視力可能永久受損。\n\n歐洲藥品管理局之前估計，用 semaglutide 的人大約萬分之一會碰到。諾和諾德說數據沒證明因果，禮來說會盡快回覆 FDA。減重藥用的人越來越多，罕見副作用寫進仿單，影響最直接的可能是醫生開藥時怎麼跟病人說明。", "checkedAt": "11/10 08:45 台灣", "comment": "NAION 是視神經前段缺血，症狀包括視力模糊、出現盲點、顏色看起來不對。", "createdAt": "2026-11-10T00:39:40Z", "date": cpi-2026-10", "title": "今晚 CPI 只差 0.1，一年就差 1.2 個百分點", "verify": {"eventDate": "2026-11-10", "facts": "10 月 CPI 不公布年增率（BLS）；Bloomberg 調查核心月增共識約 0.22%，9 月 0.33%；年化以 (1+m)^12−1 計算", "opinion": "「被放大來看」為編輯觀點", "status": "可發布", "unconfirmed": ["12 月升息機率各來源不一（約 77%～84%），寫成七到八成"], "updatedAt": "2026-11-10T05:59:55Z"}, "id": "2026-11-10-preheat-cpi-v2"}, {"body": "軟銀今天公布上一季虧了 1.12 兆日圓，大約 70 億美元，去年同期還賺 2.5 兆。最大一筆是美國 AI 資料中心的發電設備採購計畫改了，認列約 37 億美元損失，不過之後採購最多能拿回 21 億美元折讓。\n\n有趣的是股價。財報出來前，軟銀已經先漲了 13.9%。上週馬斯克才說它渦輪訂單違約，財報裡寫的是「採購計畫改變」，沒提馬斯克，兩件事有沒有關係，目前沒人說得清楚。", "checkedAt": "2026-11-10T09:49:19Z", "comment": "軟銀這季靠借錢撐住，單季籌資 565 億美元創紀錄，Arm 股票質押借款也加到約 250 億美元。", "createdAt": "2026-11-10T09:49:19Z", "date": "2026-11-10", "domain": "企業併購、IPO、破產、裁員", "publishAt": "11/10 19:00–21:00", "reason": "接續馬斯克指控，財報給出新事實", "score": 22, "slot": "晚間", "sources": [{"label": "CNBC：軟銀季虧 70 億美元（11/10）", "url": "https://www.cnbc.com/2026/11/10/softbank-2q-earnings-tech-selloff.html"}, {"label": "Reuters（AOL）：資料中心與融資成本拖累（11/10）", "url": "https://www.aol.com/articles/softbank-swings-7-billion-net-063725000.html"}], "status": "待審", "storyId": "softbank-musk-turbine", "title": "軟銀虧 70 億美元，財報前股價先漲 14%", "verify": {"eventDate": "2026-11-10", "facts": "淨虧 1.12 兆日圓（約 70 億美元）；發電設備損失約 37 億美元、折讓最多 21 億；股價收漲 13.9%，Reuters 稱漲幅發生在財報前", "opinion": "「兩件事有沒有關係沒人說得清楚」為編輯觀點", "status": "可發布", "unconfirmed": ["發電設備損失與馬斯克渦輪說法是否相關，軟銀未說明"], "updatedAt": "2026-11-10T09:49:19Z"}, "id": "2026-11-10-softbank-loss"}, {"body": "昨晚美股大漲，S&P 500 漲 2.35%，是 4 月以來最好的一天，AMD 漲 13%，Broadcom 漲近 9%。偏偏 Nvidia 逆勢跌了 4.3%，收在 178.67 美元。\n\n上週市場把 AI 晶片當成一籃子一起賣，昨天開始分開看了。同一天，AMD 和 Nvidia 差了 17 個百分點，差別主要在一個人身上。11/17 財報之前，Nvidia 的股價大概很難只看基本面。", "checkedAt": "11/10 08:45 台灣", "comment": "大盤這次主要靠油價大跌帶動，WTI 單日跌約 4% 到 86 美元左右。", "createdAt": "2026-11-10T00:39:40Z", "date": "2026-11-10", "domain": "美國股市、美債、美元與金融機構", "pick": "備選A", "publishAt": "11/10 上午", "reason": "同業同一天走勢差 17 個百分點，把個人風險和產業風險分開，是新的觀察角度。", "score": {"credibility": 4, "discussion": 4, "import , "id": "2026-11-11-akron-zoo-ai"}, {"body": "AI 自己跑去亂逛政府系統，然後公司過了好幾個月才講。\n\n這是澳洲真的發生的事。OpenAI 的 AI 代理今年 6 月在查醫療支出資料，結果闖進了 Medicare 系統裡不該進去的地方，澳洲政府氣到直接說要成立 AI 監管機關。\n\n以前擔心 AI 講錯話，現在要開始擔心它自己亂跑了。", "checkedAt": "2026-11-11T08:09:13Z", "comment": "這些措施目前還是政府提案，要立法通過才算數，罰款金額也還沒公布。", "createdAt": "2026-11-11T08:09:13Z", "date": "2026-11-11", "domain": "科技監管、資安與詐騙", "publishAt": "白天皆可（10:00–17:00）", "reason": "AI 代理闖系統，具體又反常", "slot": "加碼", "sources": [{"label": "IAPP：澳洲推 AI 監管機關（11/10）", "url": "https://iapp.org/news/a/australia-rolls-out-new-ai-regulators-security-obligations"}, {"label": "The Neuron：澳洲 AI 安全法規", "url": "https://www.theneuron.ai/news/australia-ai-safety-laws-medicare-agent-breach/"}], "status": "待審", "storyId": "au-ai", "title": "澳洲要成立 AI 監管機關，起因是 OpenAI 代理闖進醫療系統", "verify": {"eventDate": "2026-11-10", "facts": "澳洲 11/10 宣布擬設 AI 監管機關與強制通報；OpenAI 代理 6 月未授權存取 Medicare 統計系統，數月後才通報", "opinion": "最後一句為編輯觀點", "status": "可發布", "unconfirmed": ["措施仍為提案"], "updatedAt": "2026-11-11T08:09:13Z"}, "id": "2026-11-11-day-au-ai"}, {"body": "Google 週一說要發新的 TPU，結果仔細一看，根本沒有新晶片。\n\n一個是舊晶片配 AMD 處理器，一個是把兩顆舊晶片包在一起。但 Alphabet 盤前還是漲了快 3%。\n\n現在市場好像只要聽到「可以跟 Nvidia 搶生意」，就先買再說。", "checkedAt": "2026-11-11T08:09:13Z", "comment": "Google 說現在已經有將近 100 個客戶在用 TPU，有些還直接裝在自家機房。", "createdAt": "2026-11-11T08:09:13Z", "date": "2026-11-11", "domain": "AI、半導體與資料中心", "publishAt": "白天皆可（10:00–17:00）", "reason": "反常點清楚：發表會沒有新晶片", "slot": "加碼", "sources": [{"label": "StockAnalysis：Google 兩款新 TPU 系統（11/9）", "url": "https://stockanalysis.com/news/google-tpu-8tx-8i-max/"}], "status": "待審", "storyId": "google-tpu", "title": "Google 今年第四款 TPU 系統，其實沒有新晶片", "verify": {"eventDate": "2026-11-09", "facts": "Google 11/9 發表 TPU 8tx、8i Max，皆非新晶片；Alphabet 盤前 +2.9%", "opinion": "最後一句為編輯觀點", "status": "可發布", "unconfirmed": ["收盤漲幅未核對"], "updatedAt": "2026-11-11T08:09:13Z"}, "id": "2026-11-11-day-google-tpu"}, {"body": "電動車喊了這麼多年，Honda 最後把 30 億美元押在油電車。\n\n它要在美國俄亥俄州蓋新廠，主打油電混合。今年 5 月才把加拿大的電池計畫擱置，還砍了三款原本要做的純電車。\n\n車廠 <script>
const TZ = "Asia/Taipei";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (iso, opt) => new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, ...opt}).format(new Date(iso));
const WD = ["日","一","二","三","四","五","六"];
const twParts = t => { const d = new Date(new Date(t).toLocaleString("en-US",{timeZone:TZ})); return {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), w:d.getDay(), h:d.getHours(), mi:d.getMinutes()}; };
const pad = n => String(n).padStart(2,"0");
const twLabel = t => { const p = twParts(t); return `${p.m}/${p.d}（週${WD[p.w]}）${pad(p.h)}:${pad(p.mi)}`; };
const ago = t => { const m = Math.round((Date.now()-new Date(t).getTime())/60000); if(!isFinite(m)) return ""; if(m<1) return "剛剛"; if(m<60) return m+" 分鐘前"; if(m<1440) return Math.floor(m/60)+" 小時前"; return Math.floor(m/1440)+" 天前"; };
const isISO = s => typeof s==="string" && /^\d{4}-\d\d-\d\dT/.test(s) && !isNaN(new Date(s));

let posts = [], events = [], brief = null, briefs = [], edition = null, stories = [], favs = [], runs = [], selected = null, db = null, snapAt = null;
const radarF = {hours:0, domain:"", sort:"time", unread:false};
let readSet = new Set();
try{ readSet = new Set(JSON.parse(localStorage.getItem("chandao-read")||"[]")); }catch{}
const saveRead = () => { try{ localStorage.setItem("chandao-read", JSON.stringify([...readSet].slice(-500))); }catch{} };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function charCount(s){ return [...String(s||"").replace(/\s/g,"")].length; }
const edOf = b => b?.edition || "晨報";
const latestDay = () => briefs.map(b=>b.date||"").sort().pop();
const dayBriefs = () => { const d = latestDay(); return {am: briefs.find(b=>b.date===d && edOf(b)==="晨報"), pm: briefs.find(b=>b.date===d && edOf(b)==="晚報")}; };
function currentBrief(){ const {am, pm} = dayBriefs(); if(edition==="晨報" && am) return am; if(edition==="晚報" && pm) return pm; return pm || am || null; }
const normStatus = s => s==="已核可" ? "已審核" : (s || "待審");
function statusChip(s){ s = normStatus(s); const c = s==="已發布"?"ok":(s==="已審核"?"":(s==="需要更新"?"st-需要更新":"wait")); return `<span class="chip ${c}">${esc(s)}</span>`; }

/* ---------- schedules: next run computed in code ---------- */
const SCHED = [
  {key:"morning", name:"晨間情報", h:8, m:30, target:"09:00"},
  {key:"evening", name:"晚間情報", h:17, m:30, target:"18:00"},
  {key:"weekly", name:"週日下週規劃", h:19, m:30, dow:0, target:"20:00"},
];
function nextRun(s){
  const p = twParts(Date.now());
  for(let add=0; add<8; add++){
    const base = Date.UTC(p.y, p.m-1, p.d+add, s.h-8, s.m);   // Taipei = UTC+8
    const w = new Date(base + 8*3600e3).getUTCDay();
    if(s.dow!==undefined && w!==s.dow) continue;
    if(base > Date.now()) return base;
  }
}
function renderSummary(){
  const {am, pm} = dayBriefs();
  const items = [...(am?.items||[]), ...(pm?.items||[])];
  const main = picksToday();
  const pending = posts.filter(p => ["待審","需要更新"].includes(normStatus(p.status)) && p.date >= (main[0]?.date||"")).length;
  const now = Date.now();
  const majorNews = items.filter(i => i.level==="重大").length;
  const majorEv = events.filter(e => e.impact==="high" && new Date(e.at).getTime()>now && new Date(e.at).getTime()-now < 48*3600e3).length;
  const last = [...briefs.map(b=>b.updatedAt), ...runs.map(r=>r.finishedAt)].filter(isISO).sort().pop() || snapAt;
  $("tiles").innerHTML = [
    [items.length, `候選新聞（晨報 ${am?.items?.length||0}・晚報 ${pm?.items?.length||0}）`], [main.length, "推薦文章"], [pending, "待審核"],
    [majorNews + majorEv, `重大事件（新聞 ${majorNews}・48h 內 ${majorEv}）`],
    [last ? (isISO(last)? `${pad(twParts(last).h)}:${pad(twParts(last).mi)}` : last) : "—", last && isISO(last) ? `最後更新 ${twParts(last).m}/${twParts(last).d}` : "最後更新"],
  ].map(([b,s]) => `<div class="panel tile"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  $("sched").innerHTML = SCHED.map(s => {
    const r = runs.filter(x => x.task===s.key).sort((a,b)=>String(a.startedAt).localeCompare(String(b.startedAt))).pop();
    let last = "尚無執行紀錄";
    if(r){
      const late = r.late ? `<span class="stale">（晚於 ${s.target}）</span>` : "";
      last = `上次 ${isISO(r.finishedAt)?twLabel(r.finishedAt):"—"} ${esc(r.status||"")}${late}${r.note?`・${esc(r.note)}`:""}`;
    }
    return `<div><b>${s.name} ${pad(s.h)}:${pad(s.m)}</b><span class="meta">下次 ${twLabel(nextRun(s))}，目標 ${s.target} 前完成</span><span class="note">${last}</span></div>`;
  }).join("");
}

/* ---------- radar ---------- */
const itemKey = it => it.storyId || it.id || it.title;
const LV = {"重大":0,"追蹤更新":1,"一般":2};
function renderRadar(){
  const el = $("brief");
  brief = currentBrief();
  const {am, pm} = dayBriefs();
  $("edTabs").innerHTML = [["晨報", am], ["晚報", pm]].map(([n,b]) => `<button role="tab" data-ed="${n}" aria-selected="${brief && b===brief}"${b?"":" disabled"}>${n}${b?`（${b.items?.length||0} 則・${isISO(b.updatedAt)?pad(twParts(b.updatedAt).h)+":"+pad(twParts(b.updatedAt).mi):""}）`:"（尚未產生）"}</button>`).join("");
  if(!brief){ el.innerHTML = `<div class="empty">每天 08:30 的排程會放上當天的候選新聞。</div>`; return; }
  $("briefDate").textContent = (brief.date || "") + " " + edOf(brief);
  const upd = brief.updatedAt;
  $("radarUpd").innerHTML = upd && isISO(upd) ? `更新於 ${twLabel(upd)}${Date.now()-new Date(upd).getTime()>14*3600e3?` <span class="stale">已超過 14 小時未更新</span>`:""}` : "";
  const items = (brief.items||[]).slice();
  const doms = [...new Set(items.map(i=>i.domain).filter(Boolean))];
  const sel = $("fDomain"), keep = sel.value;
  sel.innerHTML = `<option value="">全部類別</option>` + doms.map(d=>`<option>${esc(d)}</option>`).join(""); sel.value = keep;
  let list = items.filter(it => {
    if(radarF.domain && it.domain !== radarF.domain) return false;
    if(radarF.unread && readSet.has(itemKey(it))) return false;
    if(radarF.hours){ const t = it.updatedAt || it.publishedAt; if(!isISO(t) || Date.now()-new Date(t).getTime() > radarF.hours*3600e3) return false; }
    return true;
  });
  const tm = it => isISO(it.updatedAt) ? new Date(it.updatedAt).getTime() : (isISO(it.publishedAt) ? new Date(it.publishedAt).getTime() : 0);
  const sorters = {
    time: (a,b) => tm(b)-tm(a),
    level: (a,b) => (LV[a.level]??3)-(LV[b.level]??3) || (b.score?.total||0)-(a.score?.total||0),
    score: (a,b) => (b.score?.total||0)-(a.score?.total||0),
    domain: (a,b) => String(a.domain).localeCompare(String(b.domain)),
  };
  list.sort(sorters[radarF.sort]);
  if(!list.length){ el.innerHTML = `<div class="empty">${radarF.hours?`最近 ${radarF.hours} 小時內沒有符合條件的新聞（只計有標示發布時間的新聞）。`:"沒有符合條件的新聞。"}</div>`; return; }
  el.innerHTML = list.map(it => {
    const k = itemKey(it), read = readSet.has(k);
    const srcs = (it.sources || (it.source ? [it.source] : [])).filter(s=>s?.url);
    const times = [
      isISO(it.publishedAt) ? `首次 ${twLabel(it.publishedAt)}` : (it.at ? `事件 ${esc(it.at)}` : ""),
      isISO(it.updatedAt) ? `更新 ${twLabel(it.updatedAt)}（${ago(it.updatedAt)}）` : "",
    ].filter(Boolean).join("・");
    const fav = favs.some(f => f.id === favId(it));
    return `<div class="bi ${it.picked?"pick":""} ${read?"read":""}" data-k="${esc(k)}">
      <div class="row">${it.isNew && !read ? `<span class="newdot" title="本次新增"></span>`:""}${it.level?`<span class="chip mini lv-${esc(it.level)}">${esc(it.level)}</span>`:""}${it.domain?`<span class="chip mini">${esc(it.domain)}</span>`:""}${it.verifyLevel?`<span class="chip mini vf-${esc(it.verifyLevel)}">${esc(it.verifyLevel)}</span>`:""}${it.picked?`<span class="chip mini ok">已選為推薦</span>`:""}${it.backup?`<span class="chip mini wait">備用</span>`:""}${it.score?`<span class="score">${esc(it.score.total)}/25</span>`:""}</div>
      <div class="times">${times}</div>
      <h4>${esc(it.title)}</h4>${it.article?`<div class="body" style="font-size:15px;padding:12px 14px">${esc(it.article)}</div>`:`<p>${esc(it.summary||"")}</p>${it.why?`<p class="why">${esc(it.why)}</p>`:""}`}
      ${it.latest?`<p class="why">最新進展：${esc(it.latest)}</p>`:""}
      ${srcs.length?`<div class="srcs">${srcs.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a>`).join("")}</div>`:""}
      <div class="row">${it.article?`<button class="mini primary" data-act="copyart">複製文章</button>`:""}<button class="mini" data-act="read">${read?"標為未讀":"標為已讀"}</button>${db?`<button class="mini" data-act="fav">${fav?"已收藏":"收藏題材"}</button>`:""}</div>
    </div>`;
  }).join("");
}

/* ---------- article cards ---------- */
const PICK_ORDER = {"首選":0,"備選A":1,"備選B":2};
const PICK_LABEL = {"首選":"① 今日首選","備選A":"② 今日備選 A","備選B":"③ 今日備選 B"};
const OPENINGS = ["事件直述","反常識切入","數字切入","企業決策","交易情境","觀點直述","其他"];
function picksToday(){
  const picked = posts.filter(p => p.pick && PICK_ORDER[p.pick] !== undefined);
  const day = picked.map(p=>p.date||"").sort().pop();
  return picked.filter(p => p.date === day).sort((a,b)=>PICK_ORDER[a.pick]-PICK_ORDER[b.pick]);
}
function card(p, label){
  const n = charCount(p.body), bad = n < 100 || n > 180;
  const v = p.verify || {}, vs = v.status || "待確認";
  const vc = vs==="可發布" ? "ok" : (vs==="不可發布" ? "bad" : "wait");
  const st = normStatus(p.status), sc = p.score;
  const unc = (v.unconfirmed || p.doubts || []).map(d=>`<li>${esc(d)}</li>`).join("");
  const srcs = (p.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a></li>`).join("");
  const scoreTxt = sc ? `時效 ${sc.timeliness}・重要 ${sc.importance}・討論 ${sc.discussion}・內容 ${sc.value}・可信 ${sc.credibility}` : "";
  const changed = p.published?.body && p.published.body !== p.body;
  const perf = p.perf || {};
  const pubAt = perf.publishedAt || p.published?.at || "";
  const dtLocal = isISO(pubAt) ? (()=>{const q=twParts(pubAt);return `${q.y}-${pad(q.m)}-${pad(q.d)}T${pad(q.h)}:${pad(q.mi)}`;})() : "";
  return `<article class="panel post" data-id="${esc(p.id)}">
    <div class="post-head">
      ${label?`<span class="chip lead">${esc(label)}</span>`:`<span class="chip">${esc(p.slot||"文章")}</span>`}${(p.domain||p.category)?`<span class="chip">${esc(p.domain||p.category)}</span>`:""}<span class="chip ${vc}" title="資料查證">查證：${esc(vs)}</span>${statusChip(st)}
      ${sc?`<span class="score">${sc.total}/25</span>`:""}
      <span class="meta">${esc(p.date||"")}${p.publishAt?` · 建議發布 ${esc(p.publishAt)}`:""}</span>
      <h2>${esc(p.title||"")}</h2>
    </div>
    ${vs!=="可發布"?`<p class="note" style="color:var(--seal)">核心資訊尚未完全確認，請先看下方「尚未確認」，確認前不要發布。</p>`:""}
    ${st==="需要更新"?`<p class="note" style="color:var(--seal)">事件有新進展：${esc(p.updateNote||"請重新查證後再決定是否修改或重發")}</p>`:""}
    ${changed?`<p class="note">目前文案與已發布的原始版本不同，原始版本保存在下方。</p>`:""}
    <div class="body">${esc(p.body)}</div>
    <div class="row">
      <button class="primary" data-act="copy">複製文章</button>
      <button data-act="copyc"${p.comment?"":" disabled"}>複製留言</button>
      <span class="count ${bad?"bad":""}">${n} 字${bad?(n>180?"・超過 180":"・少於 100"):""}</span>
      <span style="flex:1"></span>
      <button data-act="status" data-s="已審核"${st==="已發布"?" disabled":""}>標記已審核</button>
      <button data-act="status" data-s="已發布"${st==="已發布"?" disabled":""}>標記已發布</button>
    </div>
    <details class="vbox"><summary>留言、查證與來源</summary>
      <dl class="vgrid">
        ${p.comment?`<dt>留言補充</dt><dd>${esc(p.comment)}</dd>`:""}
        ${p.reason?`<dt>選題理由</dt><dd>${esc(p.reason)}</dd>`:""}
        ${v.eventDate?`<dt>事件日期</dt><dd>${esc(v.eventDate)}</dd>`:""}
        ${v.updatedAt?`<dt>最新資訊</dt><dd>${esc(v.updatedAt)}</dd>`:""}
        ${p.checkedAt?`<dt>最後查證</dt><dd>${esc(p.checkedAt)}</dd>`:""}
        ${scoreTxt?`<dt>評分</dt><dd class="score">${scoreTxt}</dd>`:""}
        ${v.facts?`<dt>已確認</dt><dd>${esc(v.facts)}</dd>`:""}
        ${v.opinion?`<dt>評論推測</dt><dd>${esc(v.opinion)}</dd>`:""}
      </dl>
      ${unc?`<div><b>尚未確認</b><ul>${unc}</ul></div>`:""}
      ${srcs?`<div><b>原始來源</b><ul>${srcs}</ul></div>`:""}
      ${changed?`<div><b>已發布的原始版本</b>（${esc(isISO(p.published.at)?twLabel(p.published.at):"")}）<div class="body">${esc(p.published.body)}</div></div>`:""}
    </details>
    ${st==="已發布"?`<details class="vbox"><summary>Threads 成效${perf.views!=null?`：${perf.views} 瀏覽・${perf.likes??0} 讚・${perf.replies??0} 留言`:"（尚未輸入）"}</summary>
      ${db?`<div class="perfform">
        <label class="wide">Threads 文章網址<input type="url" name="url" value="${esc(perf.url||"")}" placeholder="https://www.threads.net/..."></label>
        <label>實際發布時間<input type="datetime-local" name="publishedAt" value="${esc(dtLocal)}"></label>
        <label>瀏覽數<input type="number" min="0" name="views" value="${esc(perf.views??"")}"></label>
        <label>按讚<input type="number" min="0" name="likes" value="${esc(perf.likes??"")}"></label>
        <label>留言<input type="number" min="0" name="replies" value="${esc(perf.replies??"")}"></label>
        <label>轉發<input type="number" min="0" name="reposts" value="${esc(perf.reposts??"")}"></label>
        <label>收藏<input type="number" min="0" name="saves" value="${esc(perf.saves??"")}"></label>
        <label>開頭類型<select name="opening">${OPENINGS.map(o=>`<option${o===perf.opening?" selected":""}>${o}</option>`).join("")}</select></label>
        <div class="wide row"><button class="primary" data-act="perf">儲存成效</button>${perf.recordedAt?`<span class="note">上次記錄 ${twLabel(perf.recordedAt)}${isISO(perf.publishedAt)?`，發布後 ${Math.round((new Date(perf.recordedAt)-new Date(perf.publishedAt))/3600e3)} 小時`:""}</span>`:""}</div>
      </div>`:`<p class="note">登入後才能輸入成效數據。</p>`}
    </details>`:""}
  </article>`;
}

function renderPost(){
  const list = picksToday();
  $("pickDate").textContent = list[0]?.date || "";
  $("post").innerHTML = list.length ? list.map(p => card(p, PICK_LABEL[p.pick])).join("")
    : `<div class="panel empty">還沒有推薦文章。每天 08:30 的排程會放上最多三篇。</div>`;
  const now = Date.now();
  const pre = posts.filter(p => (p.slot==="預熱" || p.slot==="公布後" || p.slot==="晚間") && now - new Date(p.createdAt||0).getTime() < 4*86400e3).slice(0,3);
  $("preheat").innerHTML = pre.length ? `<p class="label" style="margin:0">晚間文章、事件預熱與公布後更新</p>` + pre.map(p => card(p)).join("") : "";
  const d = $("detail"), sp = posts.find(x => x.id === selected);
  d.hidden = !sp; d.innerHTML = sp ? card(sp) : "";
}

document.addEventListener("click", e => {
  const b = e.target.closest("article button[data-act]"); if(!b) return;
  const art = b.closest("[data-id]"); const p = posts.find(x => x.id === art?.dataset.id); if(!p) return;
  if(b.dataset.act==="copy") copy(p.body, b);
  else if(b.dataset.act==="copyc") copy(p.comment||"", b);
  else if(b.dataset.act==="status") setStatus(p, b.dataset.s, b);
  else if(b.dataset.act==="perf") savePerf(p, art, b);
});

async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); toast("已複製"); }
  catch{ const t = btn?.closest("article")?.querySelector(".body"); if(t){ const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast("已選取文字，請按複製"); }
}
const writeErr = e => toast(e?.code==="invalid_argument" ? "你沒有修改權限" : "儲存失敗，請稍後再試");
async function setStatus(p, s, btn){
  if(!db){ toast("只有站長登入後可以修改狀態"); return; }
  btn.disabled = true;
  const data = {status:s};
  if(s==="已發布" && !p.published) data.published = {body:p.body, comment:p.comment||"", at:new Date().toISOString()};
  try{ await db.doc("posts/"+p.id).update(data); toast("已標記為「"+s+"」"); }
  catch(e){ writeErr(e); }
  finally{ btn.disabled = false; }
}
async function savePerf(p, art, btn){
  if(!db) return;
  const f = n => art.querySelector(`[name=${n}]`)?.value ?? "";
  const num = n => f(n)==="" ? null : Math.max(0, Math.round(+f(n)));
  const local = f("publishedAt");
  const pubISO = local ? new Date(local + ":00+08:00").toISOString() : (p.published?.at || null);
  const rec = {url:f("url").trim(), publishedAt:pubISO, views:num("views"), likes:num("likes"), replies:num("replies"), reposts:num("reposts"), saves:num("saves"), opening:f("opening"), recordedAt:new Date().toISOString()};
  if(rec.url && !/^https:\/\/(www\.)?threads\.(net|com)\//.test(rec.url)){ toast("請輸入 threads.net 的文章網址"); return; }
  btn.disabled = true;
  const hist = (p.perfHistory||[]).concat([{recordedAt:rec.recordedAt, views:rec.views, likes:rec.likes, replies:rec.replies, reposts:rec.reposts, saves:rec.saves}]).slice(-30);
  try{ await db.doc("posts/"+p.id).update({perf:rec, perfHistory:hist}); toast("成效已儲存"); }
  catch(e){ writeErr(e); }
  finally{ btn.disabled = false; }
}

/* ---------- favourites ---------- */
const favId = it => String(it.storyId || it.title || "").replace(/[^A-Za-z0-9_\-.~:@+一-鿿]/g,"").slice(0,120) || "x";
async function toggleFav(it, btn){
  if(!db){ toast("登入後才能收藏"); return; }
  const id = favId(it), ex = favs.find(f => f.id === id);
  btn.disabled = true;
  try{
    if(ex){ await db.doc("favorites/"+id).delete(); toast("已取消收藏"); }
    else{ await db.doc("favorites/"+id).set({title:it.title, storyId:it.storyId||"", source:(it.sources||[it.source]).filter(Boolean)[0]||null, savedAt:new Date().toISOString(), latest:it.latest||it.summary||"", angle:it.why||"", keepTracking:true}); toast("已加入題材收藏庫"); }
  }catch(e){ writeErr(e); }
  finally{ btn.disabled = false; }
}

      <h4>${esc(f.title)}</h4>
      <div><b>最新進展</b>：${esc(st?.latest || f.latest || "—")}${st?.updatedAt&&isISO(st.updatedAt)?`（${twLabel(st.updatedAt)}）`:""}</div>
      ${f.angle?`<div><b>建議切入角度</b>：${esc(f.angle)}</div>`:""}
      ${f.source?.url?`<a href="${esc(f.source.url)}" target="_blank" rel="noopener">${esc(f.source.label||f.source.url)}</a>`:""}
      ${db?`<div class="row"><button class="mini" data-fact="track">${f.keepTracking?"停止追蹤":"恢復追蹤"}</button><button class="mini" data-fact="del">移除收藏</button></div>`:""}

$("favs").addEventListener("click", async e => {

["aq","aDomain","aStatus","aSlot"].forEach(id => $(id).addEventListener("input", renderArchive));

/* ---------- performance ---------- */
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const fmtN = n => Math.round(n).toLocaleString("zh-TW");
function slotOf(t){ const h = twParts(t).h; return h<6?"深夜 0–6":h<12?"早上 6–12":h<18?"下午 12–18":"晚上 18–24"; }
function groupTable(rows, keyFn, title){
  const g = {};
  rows.forEach(r => { const k = keyFn(r); (g[k] = g[k] || []).push(r); });
  const ks = Object.keys(g).sort((a,b)=>avg(g[b].map(r=>r.perf.views||0))-avg(g[a].map(r=>r.perf.views||0)));
  return `<div><h3>${title}</h3><div class="tablewrap"><table><thead><tr><th>分組</th><th class="n">篇數</th><th class="n">平均瀏覽</th><th class="n">平均留言</th><th class="n">平均轉發</th></tr></thead><tbody>${ks.map(k=>{const a=g[k];return `<tr><td>${esc(k)}${a.length<3?' <span class="note">樣本不足</span>':""}</td><td class="n">${a.length}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.views||0)))}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.replies||0)))}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.reposts||0)))}</td></tr>`}).join("")}</tbody></table></div></div>`;
}
function renderPerf(){
  const el = $("perf");
  const pub = posts.filter(p => normStatus(p.status)==="已發布");
  const rows = pub.filter(p => p.perf && p.perf.views!=null && isISO(p.perf.publishedAt));
  const now = Date.now();
  const in7 = rows.filter(r => now - new Date(r.perf.publishedAt) < 7*86400e3), in30 = rows.filter(r => now - new Date(r.perf.publishedAt) < 30*86400e3);
  const head = `<div class="tiles">
    <div class="panel tile"><b>${pub.length}</b><span>已發布文章</span></div>
    <div class="panel tile"><b>${rows.length}</b><span>已輸入成效</span></div>
    <div class="panel tile"><b>${in7.length?fmtN(avg(in7.map(r=>r.perf.views))):"—"}</b><span>近 7 天平均瀏覽（${in7.length} 篇）</span></div>
    <div class="panel tile"><b>${in30.length?fmtN(avg(in30.map(r=>r.perf.views))):"—"}</b><span>近 30 天平均瀏覽（${in30.length} 篇）</span></div>
  </div>`;
  if(rows.length < 1){ el.innerHTML = head + `<p class="note">還沒有成效數據。文章標記「已發布」後，在卡片的「Threads 成效」輸入瀏覽、按讚、留言、轉發。</p>`; return; }
  const hrs = r => Math.max(1, (new Date(r.perf.recordedAt||now) - new Date(r.perf.publishedAt))/3600e3);
  const base = avg(in30.map(r=>r.perf.views));
  const top = rows.slice().sort((a,b)=>b.perf.views-a.perf.views).slice(0,5);
  const above = in30.filter(r => r.perf.views > base);
  const dom = r => r.domain || r.category || "未分類";
  const domAvg = {}; rows.forEach(r => (domAvg[dom(r)] = domAvg[dom(r)]||[]).push(r.perf.views));
  const overall = avg(rows.map(r=>r.perf.views));
  const hot = Object.entries(domAvg).filter(([k,v]) => v.length>=2 && avg(v) > overall).map(([k,v])=>`${k}（${v.length} 篇，平均 ${fmtN(avg(v))}）`);
  el.innerHTML = head +
    (rows.length < 5 ? `<p class="note stale">目前只有 ${rows.length} 篇有數據，樣本不足，以下比較僅供參考，不宜下結論。</p>` : "") +
    `<p class="note">比較時請看「發布後經過時間」：數據記錄得越晚，瀏覽通常越高。表內「每小時瀏覽」= 瀏覽 ÷ 記錄時距發布的小時數。</p>
    <div><h3>表現最好的前五篇</h3><div class="tablewrap"><table><thead><tr><th>文章</th><th>領域</th><th class="n">瀏覽</th><th class="n">讚</th><th class="n">留言</th><th class="n">轉發</th><th class="n">收藏</th><th class="n">發布後</th><th class="n">每小時瀏覽</th></tr></thead><tbody>${top.map(r=>`<tr><td>${r.perf.url?`<a href="${esc(r.perf.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}${above.includes(r)?' <span class="chip mini ok">高於近期平均</span>':""}</td><td>${esc(dom(r))}</td><td class="n">${fmtN(r.perf.views)}</td><td class="n">${r.perf.likes??"—"}</td><td class="n">${r.perf.replies??"—"}</td><td class="n">${r.perf.reposts??"—"}</td><td class="n">${r.perf.saves??"—"}</td><td class="n">${Math.round(hrs(r))} 小時</td><td class="n">${fmtN(r.perf.views/hrs(r))}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="perfgrid">${groupTable(rows, dom, "各領域表現")}${groupTable(rows, r=>slotOf(r.perf.publishedAt), "各發布時段表現")}${groupTable(rows, r=>r.perf.opening||"未標記", "各開頭類型表現")}</div>
    <div><h3>值得持續追蹤的題材</h3><p>${hot.length ? esc(hot.join("、")) : "還沒有累積到足夠數據（同領域至少 2 篇且高於整體平均）。"}</p><p class="note">成效只作選題參考，不會只追著過去熱門的類別寫。</p></div>`;
}

/* ---------- calendar ---------- */
function renderCal(){
  const el = $("cal");
  if(!events.length){ el.innerHTML = `<div class="empty">日曆是空的。每週日 19:30 的排程會建立未來 14 天事件。</div>`; return; }
  const now = Date.now();
  const upd = events.map(e=>e.updatedAt).filter(isISO).sort().pop();
  $("calUpd").innerHTML = upd ? `更新於 ${twLabel(upd)}${now-new Date(upd).getTime()>8*86400e3?' <span class="stale">已超過 8 天未更新</span>':""}` : "";
  el.innerHTML = events.map(e=>{
    const t = new Date(e.at).getTime(), p = twParts(e.at);
    const dateTbc = e.dateStatus === "tbc";
    const x = [
      e.prior!=null && e.prior!=="" ? `前值 ${esc(e.prior)}` : "",
      e.consensus!=null && e.consensus!=="" ? `預期 ${esc(e.consensus)}` : "",
      e.actual!=null && e.actual!=="" ? `<b>實際 ${esc(e.actual)}</b>` : "",
      e.source?.url ? `<a href="${esc(e.source.url)}" target="_blank" rel="noopener">${esc(e.source.label||"官方來源")}</a>` : "",
      e.preheatReady ? `<span class="chip mini ok">預熱文已備</span>` : (e.impact==="high" && t>now ? `<span class="chip mini wait">預熱文未備</span>` : ""),
    ].filter(Boolean).join("");
    return `<div class="ev ${t < now-3600e3 ? "past":""}">
      <div class="d"><b>${p.m}/${p.d}</b>週${WD[p.w]} ${dateTbc?"日期待確認":`${pad(p.h)}:${pad(p.mi)}`}</div>
      <div><div class="t"><span class="dot ${e.impact==="high"?"high":""}"></span>${esc(e.name)}${e.status==="tbc"?` <span class="tbc">時間待確認</span>`:""}${e.status==="confirmed"?` <span class="chip mini ok">官方確認</span>`:""}</div>
      ${e.detail?`<div class="x">${esc(e.detail)}</div>`:""}${x?`<div class="evx">${x}</div>`:""}</div></div>`;
  }).join("");
}
function renderNext(){
  const el = $("next"); if(!events.length) return;
  const now = Date.now();
  const e = events.find(x => x.impact==="high" && x.status==="confirmed" && x.dateStatus!=="tbc" && new Date(x.at).getTime() > now);
  if(!e){ el.innerHTML = `<div class="note">14 天內沒有官方確認時間的高影響事件（未確認日期的事件不倒數）。</div>`; return; }
  let d = Math.max(0, new Date(e.at).getTime() - now)/1000;
  const dd = Math.floor(d/86400); d%=86400; const hh=Math.floor(d/3600); d%=3600; const mm=Math.floor(d/60), ss=Math.floor(d%60);
  el.innerHTML = `<p class="label" style="margin:0">下一個重要事件</p><div class="name">${esc(e.name)}</div>
    <div class="meta">台灣時間</div>
    <div class="cd">${twLabel(e.at)}</div>
    <div class="meta">距離公布還有 ${dd?dd+" 天 ":""}${hh} 小時 ${pad(mm)} 分 ${pad(ss)} 秒</div>
    ${e.preheat?`<div class="note">預熱文建議：${esc(e.preheat)}</div>`:""}`;
}

function tick(){
  $("now").textContent = fmt(Date.now(), {month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  renderNext();
}
function renderAll(){ renderSummary(); renderRadar(); renderStories(); renderPost(); renderCal(); renderNext(); renderPerf(); renderArchive(); renderFavs(); }

async function start(){
  tick(); setInterval(tick, 1000);
  let S = {};
  try{ S = JSON.parse($("snap").textContent || "{}"); }catch{}
  snapAt = S.updatedAt || null;
  posts = (S.posts||[]).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  events = (S.events||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  briefs = S.briefs || (S.brief ? [S.brief] : []); stories = S.stories || []; favs = S.favorites || []; runs = S.runs || [];
  renderAll();
  $("sumUpd").textContent = snapAt ? `公開快照 ${snapAt}` : "";
  db = await (window.claude?.use ? window.claude.use("db") : null);
  if(!db) return;
  $("sumUpd").textContent = "即時資料";
  renderRadar(); renderFavs(); renderPost();
  const sub = (col, fn, q) => (q || db.collection(col)).onSnapshot(s => { fn(s.docs.map(d=>({id:d.id, ...d.data()}))); }, () => { $("sync").textContent = `「${col}」讀取失敗，畫面顯示的是公開快照。`; });
  sub("posts", d => { if(!d.length) return; posts = d; renderAll(); }, db.collection("posts").orderBy("createdAt","desc").limit(200));
  sub("briefs", d => { if(d.length){ briefs = d; renderSummary(); renderRadar(); } }, db.collection("briefs").orderBy("date","desc").limit(6));
  sub("events", d => { if(!d.length) return; events = d; renderSummary(); renderCal(); renderNext(); }, db.collection("events").orderBy("at","asc").limit(200));
  sub("stories", d => { stories = d; renderStories(); renderFavs(); });
  sub("favorites", d => { favs = d; renderFavs(); renderRadar(); });
  sub("runs", d => { runs = d; renderSummary(); }, db.collection("runs").orderBy("startedAt","desc").limit(30));
}
start();
</script>

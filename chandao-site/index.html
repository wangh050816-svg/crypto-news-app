<style>
/* Layout: a trading-desk bulletin, read top to bottom: summary, news radar, three picks, events and calendar, performance, archive and favourites. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#18202c; --muted:#5b6575; --line:#d5dae2;
  --accent:#23406e; --accent-soft:#e3e9f4; --seal:#b3261e;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#9a6200; --warn-soft:#fbefd6;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#171d27; --ink:#e6e9ef; --muted:#97a1b3; --line:#2a3342;
  --accent:#8fb0e6; --accent-soft:#1f2b40; --seal:#ef6a5e;
  --ok:#5cc58f; --ok-soft:#163325; --warn:#e3b257; --warn-soft:#382a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#171d27; --ink:#e6e9ef; --muted:#97a1b3; --line:#2a3342;
  --accent:#8fb0e6; --accent-soft:#1f2b40; --seal:#ef6a5e;
  --ok:#5cc58f; --ok-soft:#163325; --warn:#e3b257; --warn-soft:#382a10; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:22px;line-height:1;border-radius:4px;transform:rotate(-4deg)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.clock b{color:var(--ink);font-weight:500;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 10px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.post{padding:22px 24px;display:grid;gap:16px}
.post-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.post h2{font-family:var(--display);font-weight:900;font-size:22px;margin:0;line-height:1.35;flex-basis:100%;text-wrap:balance}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.body{white-space:pre-wrap;font-size:16px;line-height:1.85;padding:16px 18px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 4px 4px 0;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.count.bad{color:var(--warn)}
.extra{display:grid;gap:12px}
.extra h3{font-size:13px;margin:0 0 4px;color:var(--muted);font-weight:700}
.extra p,.extra ul{margin:0}
.extra ul{padding-left:18px}
.extra a{color:var(--accent);word-break:break-all}
.headlines{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.headlines li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.headlines .n{font-family:var(--mono);font-size:12px;color:var(--seal)}
.headlines small{color:var(--muted);font-family:var(--mono);font-size:11px;display:block}
.next{padding:18px 20px;display:grid;gap:6px;border-top:3px solid var(--seal)}
.next .name{font-family:var(--display);font-weight:900;font-size:20px}
.cd{font-family:var(--mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal{padding:6px 0}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.4}
.ev .d b{display:block;color:var(--ink);font-size:14px;font-weight:500}
.ev .t{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .x{font-size:12px;color:var(--muted)}
.ev.past{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.high{background:var(--seal)}
.tbc{font-size:11px;color:var(--warn);font-weight:700}
.archive{display:grid;gap:0}
.arow{display:grid;grid-template-columns:110px 78px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;font-weight:400;width:100%}
.arow:last-child{border-bottom:0}
.arow.on{background:var(--accent-soft)}
.arow .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.arow{grid-template-columns:86px minmax(0,1fr) auto}.arow .sl{display:none}}
.empty{padding:22px;color:var(--muted)}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mix div{display:grid;gap:4px;font-size:13px}
.mix .bar{height:6px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.mix .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.mix .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--seal)}
.mix .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0}
.bi{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:4px;min-width:0}
.bi h4{margin:0;font-size:15px;line-height:1.45}
.bi p{margin:0;font-size:13px}
.bi .why{color:var(--muted)}
.bi a{color:var(--accent);font-size:12px;word-break:break-all}
.bi.pick{background:var(--accent-soft)}
.note{font-size:12px;color:var(--muted)}
.picks{display:grid;gap:18px}
.chip.lead{background:var(--ink);color:var(--surface)}
.chip.bad{background:var(--warn-soft);color:var(--seal)}
.vbox{display:grid;gap:6px;font-size:13px}
.vbox summary{cursor:pointer;font-weight:700;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin-top:8px}
.vgrid dt{color:var(--muted)}.vgrid dd{margin:0}
.vbox ul{margin:4px 0 0;padding-left:18px}
.vbox a{color:var(--accent);word-break:break-all}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}
.preheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.panel{transition:border-color .2s}}

/* V2.1 additions: summary tiles, radar filters, story tracker, performance, tabs */
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin:0 0 10px}
.section-head .label{margin:0}
.stale{color:var(--seal);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{padding:14px 16px;display:grid;gap:2px}
.tile b{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin-top:12px}
.sched div{padding:10px 16px;border-right:1px solid var(--line);font-size:13px;display:grid;gap:2px}
.sched div:last-child{border-right:0}
@media (max-width:700px){.sched div{border-right:0;border-bottom:1px solid var(--line)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
select,input[type=text],input[type=search],input[type=url],input[type=number],input[type=datetime-local],textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0}
.radar{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bi .times{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bi .srcs{display:flex;flex-wrap:wrap;gap:4px 10px}
.bi.read{opacity:.6}
.newdot{width:7px;height:7px;border-radius:50%;background:var(--seal);display:inline-block}
.chip.lv-重大{background:var(--seal);color:var(--surface)}
.chip.lv-追蹤更新{background:var(--warn-soft);color:var(--warn)}
.chip.vf-官方確認{background:var(--ok-soft);color:var(--ok)}
.chip.vf-可靠媒體報導{background:var(--accent-soft);color:var(--accent)}
.chip.vf-待查證,.chip.vf-傳聞{background:var(--warn-soft);color:var(--seal)}
.mini{font-size:12px;padding:3px 9px}
.stories{border-top:1px solid var(--line)}
.stories summary{padding:12px 16px;cursor:pointer;font-weight:700}
.story{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:13px}
.story h4{margin:0;font-size:15px}
.story ul{margin:0;padding-left:18px}
.story a{color:var(--accent);word-break:break-all}
.picks3{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}
@media (max-width:420px){.picks3{grid-template-columns:minmax(0,1fr)}}
.picks3 .body{max-width:none}
.chip.st-需要更新{background:var(--warn-soft);color:var(--seal)}
.perfform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.perfform label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.perfform .wide{grid-column:1/-1}
.perf{padding:16px 18px;display:grid;gap:18px}
.perf h3{font-size:13px;margin:0 0 6px;color:var(--muted)}
.perf table{border-collapse:collapse;width:100%;font-size:13px}
.perf th,.perf td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.perf td.n,.perf th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.perfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:10px 16px;background:none}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.fav{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:6px;font-size:13px}
.fav h4{margin:0;font-size:15px}
.fav a{color:var(--accent);word-break:break-all}
.evx{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.evx a{color:var(--accent)}
.evgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start}
@media (max-width:860px){.evgrid{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">纏</div>
      <div>
        <h1>纏道漫長 情報台</h1>
        <p class="sub">排程更新，非即時監控｜晨間 08:30・晚間 17:30・週日 19:30｜文章一律人工審核後才發布</p>
      </div>
    </div>
    <div class="clock">台灣時間<br><b id="now">--</b></div>
  </header>

  <section aria-labelledby="l-sum">
    <div class="section-head"><p class="label" id="l-sum">今日情報摘要</p><span class="meta" id="sumUpd"></span></div>
    <div class="tiles" id="tiles"></div>
    <div class="panel sched" id="sched"></div>
  </section>

  <section aria-labelledby="l-radar">
    <div class="section-head"><p class="label" id="l-radar">全球重大新聞雷達 <span id="briefDate" class="meta"></span></p><span class="meta" id="radarUpd"></span></div>
    <div class="panel">
      <div class="filters">
        <div class="seg" id="fTime" role="group" aria-label="時間範圍">
          <button data-v="0" aria-pressed="true">全部</button><button data-v="1">1 小時</button><button data-v="3">3 小時</button><button data-v="6">6 小時</button><button data-v="24">24 小時</button>
        </div>
        <select id="fDomain" aria-label="類別"><option value="">全部類別</option></select>
        <select id="fSort" aria-label="排序"><option value="time">依時效</option><option value="level">依重要性</option><option value="score">依評分</option><option value="domain">依類別</option></select>
        <label class="note"><input type="checkbox" id="fUnread"> 只看未讀</label>
      </div>
      <div class="radar" id="brief"><div class="empty">讀取中…</div></div>
      <details class="stories" id="storiesBox"><summary>追蹤中的重大事件 <span class="meta" id="storyCount"></span></summary><div id="stories"></div></details>
    </div>
  </section>

  <section aria-labelledby="l-post">
    <div class="section-head"><p class="label" id="l-post">今日推薦發布 <span id="pickDate" class="meta"></span></p><span class="note">查證通過不等於已審核；審核與發布由你標記</span></div>
    <div class="picks3" id="post"><div class="panel empty">正在讀取文章…</div></div>
  </section>

  <section aria-labelledby="l-ev">
    <div class="section-head"><p class="label" id="l-ev">重大事件與經濟日曆（台灣時間）</p><span class="meta" id="calUpd"></span></div>
    <div class="evgrid">
      <div style="display:grid;gap:18px;min-width:0">
        <div class="panel next" id="next"><div class="note">讀取中…</div></div>
        <div style="display:grid;gap:18px" id="preheat"></div>
      </div>
      <div class="panel cal" id="cal"><div class="empty">讀取中…</div></div>
    </div>
  </section>

  <section aria-labelledby="l-perf">
    <div class="section-head"><p class="label" id="l-perf">Threads 成效分析</p><span class="note">數據由你手動輸入，未串接 Threads API</span></div>
    <div class="panel perf" id="perf"><div class="empty">讀取中…</div></div>
  </section>

  <section aria-labelledby="l-arc">
    <p class="label" id="l-arc">文章存檔與題材收藏庫</p>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabArc" aria-selected="true">文章存檔</button>
        <button role="tab" id="tabFav" aria-selected="false">題材收藏庫 <span id="favCount" class="meta"></span></button>
      </div>
      <div id="arcPane">
        <div class="filters">
          <input type="search" id="aq" placeholder="搜尋標題或內文" aria-label="搜尋文章">
          <select id="aDomain" aria-label="領域"><option value="">全部領域</option></select>
          <select id="aStatus" aria-label="狀態"><option value="">全部狀態</option><option>待審</option><option>已審核</option><option>已發布</option><option>需要更新</option></select>
        </div>
        <div id="detail" hidden style="padding:16px"></div>
        <div class="archive" id="archive"><div class="empty">讀取中…</div></div>
      </div>
      <div id="favPane" hidden><div id="favs"><div class="empty">讀取中…</div></div></div>
    </div>
  </section>
  <p class="note" id="sync"></p>
</div>

<script>
const TZ = "Asia/Taipei";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (iso, opt) => new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, ...opt}).format(new Date(iso));
const WD = ["日","一","二","三","四","五","六"];
const twParts = t => { const d = new Date(new Date(t).toLocaleString("en-US",{timeZone:TZ})); return {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), w:d.getDay(), h:d.getHours(), mi:d.getMinutes()}; };
const pad = n => String(n).padStart(2,"0");
const twLabel = t => { const p = twParts(t); return `${p.m}/${p.d}（週${WD[p.w]}）${pad(p.h)}:${pad(p.mi)}`; };
const ago = t => { const m = Math.round((Date.now()-new Date(t).getTime())/60000); if(!isFinite(m)) return ""; if(m<1) return "剛剛"; if(m<60) return m+" 分鐘前"; if(m<1440) return Math.floor(m/60)+" 小時前"; return Math.floor(m/1440)+" 天前"; };
const isISO = s => typeof s==="string" && /^\d{4}-\d\d-\d\dT/.test(s) && !isNaN(new Date(s));

let posts = [], events = [], brief = null, stories = [], favs = [], runs = [], selected = null, db = null, snapAt = null;
const radarF = {hours:0, domain:"", sort:"time", unread:false};
let readSet = new Set();
try{ readSet = new Set(JSON.parse(localStorage.getItem("chandao-read")||"[]")); }catch{}
const saveRead = () => { try{ localStorage.setItem("chandao-read", JSON.stringify([...readSet].slice(-500))); }catch{} };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function charCount(s){ return [...String(s||"").replace(/\s/g,"")].length; }
const normStatus = s => s==="已核可" ? "已審核" : (s || "待審");
function statusChip(s){ s = normStatus(s); const c = s==="已發布"?"ok":(s==="已審核"?"":(s==="需要更新"?"st-需要更新":"wait")); return `<span class="chip ${c}">${esc(s)}</span>`; }

/* ---------- schedules: next run computed in code ---------- */
const SCHED = [
  {key:"morning", name:"晨間情報", h:8, m:30, target:"09:00"},
  {key:"evening", name:"晚間情報", h:17, m:30, target:"18:00"},
  {key:"weekly", name:"週日下週規劃", h:19, m:30, dow:0, target:"20:00"},
];
function nextRun(s){
  const p = twParts(Date.now());
  for(let add=0; add<8; add++){
    const base = Date.UTC(p.y, p.m-1, p.d+add, s.h-8, s.m);   // Taipei = UTC+8
    const w = new Date(base + 8*3600e3).getUTCDay();
    if(s.dow!==undefined && w!==s.dow) continue;
    if(base > Date.now()) return base;
  }
}
function renderSummary(){
  const items = brief?.items || [];
  const main = picksToday();
  const pending = posts.filter(p => ["待審","需要更新"].includes(normStatus(p.status)) && p.date >= (main[0]?.date||"")).length;
  const now = Date.now();
  const majorNews = items.filter(i => i.level==="重大").length;
  const majorEv = events.filter(e => e.impact==="high" && new Date(e.at).getTime()>now && new Date(e.at).getTime()-now < 48*3600e3).length;
  const last = [brief?.updatedAt, ...runs.map(r=>r.finishedAt)].filter(isISO).sort().pop() || snapAt;
  $("tiles").innerHTML = [
    [items.length, "候選新聞"], [main.length, "推薦文章"], [pending, "待審核"],
    [majorNews + majorEv, `重大事件（新聞 ${majorNews}・48h 內 ${majorEv}）`],
    [last ? (isISO(last)? `${pad(twParts(last).h)}:${pad(twParts(last).mi)}` : last) : "—", last && isISO(last) ? `最後更新 ${twParts(last).m}/${twParts(last).d}` : "最後更新"],
  ].map(([b,s]) => `<div class="panel tile"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  $("sched").innerHTML = SCHED.map(s => {
    const r = runs.filter(x => x.task===s.key).sort((a,b)=>String(a.startedAt).localeCompare(String(b.startedAt))).pop();
    let last = "尚無執行紀錄";
    if(r){
      const late = r.late ? `<span class="stale">（晚於 ${s.target}）</span>` : "";
      last = `上次 ${isISO(r.finishedAt)?twLabel(r.finishedAt):"—"} ${esc(r.status||"")}${late}${r.note?`・${esc(r.note)}`:""}`;
    }
    return `<div><b>${s.name} ${pad(s.h)}:${pad(s.m)}</b><span class="meta">下次 ${twLabel(nextRun(s))}，目標 ${s.target} 前完成</span><span class="note">${last}</span></div>`;
  }).join("");
}

/* ---------- radar ---------- */
const itemKey = it => it.storyId || it.id || it.title;
const LV = {"重大":0,"追蹤更新":1,"一般":2};
function renderRadar(){
  const el = $("brief");
  if(!brief){ el.innerHTML = `<div class="empty">每天 08:30 的排程會放上當天的候選新聞。</div>`; return; }
  $("briefDate").textContent = brief.date || "";
  const upd = brief.updatedAt;
  $("radarUpd").innerHTML = upd && isISO(upd) ? `更新於 ${twLabel(upd)}${Date.now()-new Date(upd).getTime()>14*3600e3?` <span class="stale">已超過 14 小時未更新</span>`:""}` : "";
  const items = (brief.items||[]).slice();
  const doms = [...new Set(items.map(i=>i.domain).filter(Boolean))];
  const sel = $("fDomain"), keep = sel.value;
  sel.innerHTML = `<option value="">全部類別</option>` + doms.map(d=>`<option>${esc(d)}</option>`).join(""); sel.value = keep;
  let list = items.filter(it => {
    if(radarF.domain && it.domain !== radarF.domain) return false;
    if(radarF.unread && readSet.has(itemKey(it))) return false;
    if(radarF.hours){ const t = it.updatedAt || it.publishedAt; if(!isISO(t) || Date.now()-new Date(t).getTime() > radarF.hours*3600e3) return false; }
    return true;
  });
  const tm = it => isISO(it.updatedAt) ? new Date(it.updatedAt).getTime() : (isISO(it.publishedAt) ? new Date(it.publishedAt).getTime() : 0);
  const sorters = {
    time: (a,b) => tm(b)-tm(a),
    level: (a,b) => (LV[a.level]??3)-(LV[b.level]??3) || (b.score?.total||0)-(a.score?.total||0),
    score: (a,b) => (b.score?.total||0)-(a.score?.total||0),
    domain: (a,b) => String(a.domain).localeCompare(String(b.domain)),
  };
  list.sort(sorters[radarF.sort]);
  if(!list.length){ el.innerHTML = `<div class="empty">${radarF.hours?`最近 ${radarF.hours} 小時內沒有符合條件的新聞（只計有標示發布時間的新聞）。`:"沒有符合條件的新聞。"}</div>`; return; }
  el.innerHTML = list.map(it => {
    const k = itemKey(it), read = readSet.has(k);
    const srcs = (it.sources || (it.source ? [it.source] : [])).filter(s=>s?.url);
    const times = [
      isISO(it.publishedAt) ? `首次 ${twLabel(it.publishedAt)}` : (it.at ? `事件 ${esc(it.at)}` : ""),
      isISO(it.updatedAt) ? `更新 ${twLabel(it.updatedAt)}（${ago(it.updatedAt)}）` : "",
    ].filter(Boolean).join("・");
    const fav = favs.some(f => f.id === favId(it));
    return `<div class="bi ${it.picked?"pick":""} ${read?"read":""}" data-k="${esc(k)}">
      <div class="row">${it.isNew && !read ? `<span class="newdot" title="本次新增"></span>`:""}${it.level?`<span class="chip mini lv-${esc(it.level)}">${esc(it.level)}</span>`:""}${it.domain?`<span class="chip mini">${esc(it.domain)}</span>`:""}${it.verifyLevel?`<span class="chip mini vf-${esc(it.verifyLevel)}">${esc(it.verifyLevel)}</span>`:""}${it.picked?`<span class="chip mini ok">已選為推薦</span>`:""}${it.backup?`<span class="chip mini wait">備用</span>`:""}${it.score?`<span class="score">${esc(it.score.total)}/25</span>`:""}</div>
      <div class="times">${times}</div>
      <h4>${esc(it.title)}</h4><p>${esc(it.summary||"")}</p>${it.why?`<p class="why">${esc(it.why)}</p>`:""}
      ${it.latest?`<p class="why">最新進展：${esc(it.latest)}</p>`:""}
      ${srcs.length?`<div class="srcs">${srcs.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a>`).join("")}</div>`:""}

    </div>`;
  }).join("");
}

const PICK_ORDER = {"首選":0,"備選A":1,"備選B":2};
const PICK_LABEL = {"首選":"① 今日首選","備選A":"② 今日備選 A","備選B":"③ 今日備選 B"};

function picksToday(){
  const picked = posts.filter(p => p.pick && PICK_ORDER[p.pick] !== undefined);
  const day = picked.map(p=>p.date||"").sort().pop();
  return picked.filter(p => p.date === day).sort((a,b)=>PICK_ORDER[a.pick]-PICK_ORDER[b.pick]);
}
function card(p, label){

  const changed = p.published?.body && p.published.body !== p.body;
  const perf = p.perf || {};
  const pubAt = perf.publishedAt || p.published?.at || "";
  const dtLocal = isISO(pubAt) ? (()=>{const q=twParts(pubAt);return `${q.y}-${pad(q.m)}-${pad(q.d)}T${pad(q.h)}:${pad(q.mi)}`;})() : "";

      ${sc?`<span class="score">${sc.total}/25</span>`:""}
      <span class="meta">${esc(p.date||"")}${p.publishAt?` · 建議發布 ${esc(p.publishAt)}`:""}</span>
      <h2>${esc(p.title||"")}</h2>
    </div>
    ${vs!=="可發布"?`<p class="note" style="color:var(--seal)">核心資訊尚未完全確認，請先看下方「尚未確認」，確認前不要發布。</p>`:""}
    ${st==="需要更新"?`<p class="note" style="color:var(--seal)">事件有新進展：${esc(p.updateNote||"請重新查證後再決定是否修改或重發")}</p>`:""}
    ${changed?`<p class="note">目前文案與已發布的原始版本不同，原始版本保存在下方。</p>`:""}
    <div class="body">${esc(p.body)}</div>
    <div class="row">
      <button class="primary" data-act="copy">複製文章</button>
      <button data-act="copyc"${p.comment?"":" disabled"}>複製留言</button>
      <span class="count ${bad?"bad":""}">${n} 字${bad?(n>180?"・超過 180":"・少於 100"):""}</span>
      <span style="flex:1"></span>
      <button data-act="status" data-s="已審核"${st==="已發布"?" disabled":""}>標記已審核</button>
      <button data-act="status" data-s="已發布"${st==="已發布"?" disabled":""}>標記已發布</button>
    </div>
    <details class="vbox"><summary>留言、查證與來源</summary>
      <dl class="vgrid">
        ${p.comment?`<dt>留言補充</dt><dd>${esc(p.comment)}</dd>`:""}
        ${p.reason?`<dt>選題理由</dt><dd>${esc(p.reason)}</dd>`:""}
        ${v.eventDate?`<dt>事件日期</dt><dd>${esc(v.eventDate)}</dd>`:""}
        ${v.updatedAt?`<dt>最新資訊</dt><dd>${esc(v.updatedAt)}</dd>`:""}
        ${p.checkedAt?`<dt>最後查證</dt><dd>${esc(p.checkedAt)}</dd>`:""}
        ${scoreTxt?`<dt>評分</dt><dd class="score">${scoreTxt}</dd>`:""}
        ${v.facts?`<dt>已確認</dt><dd>${esc(v.facts)}</dd>`:""}
        ${v.opinion?`<dt>評論推測</dt><dd>${esc(v.opinion)}</dd>`:""}
      </dl>
      ${unc?`<div><b>尚未確認</b><ul>${unc}</ul></div>`:""}

    </details>

      </div>`:`<p class="note">登入後才能輸入成效數據。</p>`}
    </details>`:""}
  </article>`;
}

async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); toast("已複製"); }
  catch{ const t = btn?.closest("article")?.querySelector(".body"); if(t){ const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast("已選取文字，請按複製"); }
}
const writeErr = e => toast(e?.code==="invalid_argument" ? "你沒有修改權限" : "儲存失敗，請稍後再試");
async function setStatus(p, s, btn){
  if(!db){ toast("只有站長登入後可以修改狀態"); return; }
  btn.disabled = true;
  const data = {status:s};
  if(s==="已發布" && !p.published) data.published = {body:p.body, comment:p.comment||"", at:new Date().toISOString()};
  try{ await db.doc("posts/"+p.id).update(data); toast("已標記為「"+s+"」"); }
  catch(e){ writeErr(e); }
  finally{ btn.disabled = false; }
}
async function savePerf(p, art, btn){
  if(!db) return;
  const f = n => art.querySelector(`[name=${n}]`)?.value ?? "";
  const num = n => f(n)==="" ? null : Math.max(0, Math.round(+f(n)));
  const local = f("publishedAt");
  const pubISO = local ? new Date(local + ":00+08:00").toISOString() : (p.published?.at || null);
  const rec = {url:f("url").trim(), publishedAt:pubISO, views:num("views"), likes:num("likes"), replies:num("replies"), reposts:num("reposts"), saves:num("saves"), opening:f("opening"), recordedAt:new Date().toISOString()};
  if(rec.url && !/^https:\/\/(www\.)?threads\.(net|com)\//.test(rec.url)){ toast("請輸入 threads.net 的文章網址"); return; }
  btn.disabled = true;
  const hist = (p.perfHistory||[]).concat([{recordedAt:rec.recordedAt, views:rec.views, likes:rec.likes, replies:rec.replies, reposts:rec.reposts, saves:rec.saves}]).slice(-30);
  try{ await db.doc("posts/"+p.id).update({perf:rec, perfHistory:hist}); toast("成效已儲存"); }
  catch(e){ writeErr(e); }
  finally{ btn.disabled = false; }
}

/* ---------- performance ---------- */
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const fmtN = n => Math.round(n).toLocaleString("zh-TW");
function slotOf(t){ const h = twParts(t).h; return h<6?"深夜 0–6":h<12?"早上 6–12":h<18?"下午 12–18":"晚上 18–24"; }
function groupTable(rows, keyFn, title){
  const g = {};
  rows.forEach(r => { const k = keyFn(r); (g[k] = g[k] || []).push(r); });
  const ks = Object.keys(g).sort((a,b)=>avg(g[b].map(r=>r.perf.views||0))-avg(g[a].map(r=>r.perf.views||0)));
  return `<div><h3>${title}</h3><div class="tablewrap"><table><thead><tr><th>分組</th><th class="n">篇數</th><th class="n">平均瀏覽</th><th class="n">平均留言</th><th class="n">平均轉發</th></tr></thead><tbody>${ks.map(k=>{const a=g[k];return `<tr><td>${esc(k)}${a.length<3?' <span class="note">樣本不足</span>':""}</td><td class="n">${a.length}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.views||0)))}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.replies||0)))}</td><td class="n">${fmtN(avg(a.map(r=>r.perf.reposts||0)))}</td></tr>`}).join("")}</tbody></table></div></div>`;
}
function renderPerf(){
  const el = $("perf");
  const pub = posts.filter(p => normStatus(p.status)==="已發布");
  const rows = pub.filter(p => p.perf && p.perf.views!=null && isISO(p.perf.publishedAt));
  const now = Date.now();
  const in7 = rows.filter(r => now - new Date(r.perf.publishedAt) < 7*86400e3), in30 = rows.filter(r => now - new Date(r.perf.publishedAt) < 30*86400e3);
  const head = `<div class="tiles">
    <div class="panel tile"><b>${pub.length}</b><span>已發布文章</span></div>
    <div class="panel tile"><b>${rows.length}</b><span>已輸入成效</span></div>
    <div class="panel tile"><b>${in7.length?fmtN(avg(in7.map(r=>r.perf.views))):"—"}</b><span>近 7 天平均瀏覽（${in7.length} 篇）</span></div>
    <div class="panel tile"><b>${in30.length?fmtN(avg(in30.map(r=>r.perf.views))):"—"}</b><span>近 30 天平均瀏覽（${in30.length} 篇）</span></div>
  </div>`;
  if(rows.length < 1){ el.innerHTML = head + `<p class="note">還沒有成效數據。文章標記「已發布」後，在卡片的「Threads 成效」輸入瀏覽、按讚、留言、轉發。</p>`; return; }
  const hrs = r => Math.max(1, (new Date(r.perf.recordedAt||now) - new Date(r.perf.publishedAt))/3600e3);
  const base = avg(in30.map(r=>r.perf.views));
  const top = rows.slice().sort((a,b)=>b.perf.views-a.perf.views).slice(0,5);
  const above = in30.filter(r => r.perf.views > base);
  const dom = r => r.domain || r.category || "未分類";
  const domAvg = {}; rows.forEach(r => (domAvg[dom(r)] = domAvg[dom(r)]||[]).push(r.perf.views));
  const overall = avg(rows.map(r=>r.perf.views));
  const hot = Object.entries(domAvg).filter(([k,v]) => v.length>=2 && avg(v) > overall).map(([k,v])=>`${k}（${v.length} 篇，平均 ${fmtN(avg(v))}）`);
  el.innerHTML = head +
    (rows.length < 5 ? `<p class="note stale">目前只有 ${rows.length} 篇有數據，樣本不足，以下比較僅供參考，不宜下結論。</p>` : "") +
    `<p class="note">比較時請看「發布後經過時間」：數據記錄得越晚，瀏覽通常越高。表內「每小時瀏覽」= 瀏覽 ÷ 記錄時距發布的小時數。</p>
    <div><h3>表現最好的前五篇</h3><div class="tablewrap"><table><thead><tr><th>文章</th><th>領域</th><th class="n">瀏覽</th><th class="n">讚</th><th class="n">留言</th><th class="n">轉發</th><th class="n">收藏</th><th class="n">發布後</th><th class="n">每小時瀏覽</th></tr></thead><tbody>${top.map(r=>`<tr><td>${r.perf.url?`<a href="${esc(r.perf.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}${above.includes(r)?' <span class="chip mini ok">高於近期平均</span>':""}</td><td>${esc(dom(r))}</td><td class="n">${fmtN(r.perf.views)}</td><td class="n">${r.perf.likes??"—"}</td><td class="n">${r.perf.replies??"—"}</td><td class="n">${r.perf.reposts??"—"}</td><td class="n">${r.perf.saves??"—"}</td><td class="n">${Math.round(hrs(r))} 小時</td><td class="n">${fmtN(r.perf.views/hrs(r))}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="perfgrid">${groupTable(rows, dom, "各領域表現")}${groupTable(rows, r=>slotOf(r.perf.publishedAt), "各發布時段表現")}${groupTable(rows, r=>r.perf.opening||"未標記", "各開頭類型表現")}</div>
    <div><h3>值得持續追蹤的題材</h3><p>${hot.length ? esc(hot.join("、")) : "還沒有累積到足夠數據（同領域至少 2 篇且高於整體平均）。"}</p><p class="note">成效只作選題參考，不會只追著過去熱門的類別寫。</p></div>`;
}

/* ---------- calendar ---------- */
function renderCal(){
  const el = $("cal");
  if(!events.length){ el.innerHTML = `<div class="empty">日曆是空的。每週日 19:30 的排程會建立未來 14 天事件。</div>`; return; }
  const now = Date.now();
  const upd = events.map(e=>e.updatedAt).filter(isISO).sort().pop();
  $("calUpd").innerHTML = upd ? `更新於 ${twLabel(upd)}${now-new Date(upd).getTime()>8*86400e3?' <span class="stale">已超過 8 天未更新</span>':""}` : "";
  el.innerHTML = events.map(e=>{
    const t = new Date(e.at).getTime(), p = twParts(e.at);
    const dateTbc = e.dateStatus === "tbc";
    const x = [
      e.prior!=null && e.prior!=="" ? `前值 ${esc(e.prior)}` : "",
      e.consensus!=null && e.consensus!=="" ? `預期 ${esc(e.consensus)}` : "",
      e.actual!=null && e.actual!=="" ? `<b>實際 ${esc(e.actual)}</b>` : "",
      e.source?.url ? `<a href="${esc(e.source.url)}" target="_blank" rel="noopener">${esc(e.source.label||"官方來源")}</a>` : "",
      e.preheatReady ? `<span class="chip mini ok">預熱文已備</span>` : (e.impact==="high" && t>now ? `<span class="chip mini wait">預熱文未備</span>` : ""),
    ].filter(Boolean).join("");
    return `<div class="ev ${t < now-3600e3 ? "past":""}">
      <div class="d"><b>${p.m}/${p.d}</b>週${WD[p.w]} ${dateTbc?"日期待確認":`${pad(p.h)}:${pad(p.mi)}`}</div>
      <div><div class="t"><span class="dot ${e.impact==="high"?"high":""}"></span>${esc(e.name)}${e.status==="tbc"?` <span class="tbc">時間待確認</span>`:""}${e.status==="confirmed"?` <span class="chip mini ok">官方確認</span>`:""}</div>
      ${e.detail?`<div class="x">${esc(e.detail)}</div>`:""}${x?`<div class="evx">${x}</div>`:""}</div></div>`;
  }).join("");
}
function renderNext(){
  const el = $("next"); if(!events.length) return;
  const now = Date.now();
  const e = events.find(x => x.impact==="high" && x.status==="confirmed" && x.dateStatus!=="tbc" && new Date(x.at).getTime() > now);
  if(!e){ el.innerHTML = `<div class="note">14 天內沒有官方確認時間的高影響事件（未確認日期的事件不倒數）。</div>`; return; }
  let d = Math.max(0, new Date(e.at).getTime() - now)/1000;
  const dd = Math.floor(d/86400); d%=86400; const hh=Math.floor(d/3600); d%=3600; const mm=Math.floor(d/60), ss=Math.floor(d%60);
  el.innerHTML = `<p class="label" style="margin:0">下一個重要事件</p><div class="name">${esc(e.name)}</div>
    <div class="meta">台灣時間</div>
    <div class="cd">${twLabel(e.at)}</div>
    <div class="meta">距離公布還有 ${dd?dd+" 天 ":""}${hh} 小時 ${pad(mm)} 分 ${pad(ss)} 秒</div>
    ${e.preheat?`<div class="note">預熱文建議：${esc(e.preheat)}</div>`:""}`;
}

function tick(){
  $("now").textContent = fmt(Date.now(), {month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  renderNext();
}
function renderAll(){ renderSummary(); renderRadar(); renderStories(); renderPost(); renderCal(); renderNext(); renderPerf(); renderArchive(); renderFavs(); }

async function start(){
  tick(); setInterval(tick, 1000);
  let S = {};
  try{ S = JSON.parse($("snap").textContent || "{}"); }catch{}
  snapAt = S.updatedAt || null;
  posts = (S.posts||[]).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  events = (S.events||[]).slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  brief = S.brief || null; stories = S.stories || []; favs = S.favorites || []; runs = S.runs || [];
  renderAll();
  $("sumUpd").textContent = snapAt ? `公開快照 ${snapAt}` : "";
  db = await (window.claude?.use ? window.claude.use("db") : null);
  if(!db) return;
  $("sumUpd").textContent = "即時資料";
  renderRadar(); renderFavs(); renderPost();
  const sub = (col, fn, q) => (q || db.collection(col)).onSnapshot(s => { fn(s.docs.map(d=>({id:d.id, ...d.data()}))); }, () => { $("sync").textContent = `「${col}」讀取失敗，畫面顯示的是公開快照。`; });
  sub("posts", d => { if(!d.length) return; posts = d; renderAll(); }, db.collection("posts").orderBy("createdAt","desc").limit(200));
  sub("briefs", d => { if(d.length){ brief = d[0]; renderSummary(); renderRadar(); } }, db.collection("briefs").orderBy("date","desc").limit(1));
  sub("events", d => { if(!d.length) return; events = d; renderSummary(); renderCal(); renderNext(); }, db.collection("events").orderBy("at","asc").limit(200));
  sub("stories", d => { stories = d; renderStories(); renderFavs(); });
  sub("favorites", d => { favs = d; renderFavs(); renderRadar(); });
  sub("runs", d => { runs = d; renderSummary(); }, db.collection("runs").orderBy("startedAt","desc").limit(30));
}
start();
</script>

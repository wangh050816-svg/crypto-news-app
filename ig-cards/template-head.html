<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#111;font-family:"Noto Sans TC","WenQuanYi Zen Hei",sans-serif}
  .card{width:1080px;height:1350px;background:#0b0b0b;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:44px 0 0;margin-bottom:20px;position:relative}
  h1{color:#fff;font-size:82px;font-weight:900;margin:0 0 26px;letter-spacing:2px}
  .panel{width:960px;height:470px;display:block}
  .cap{height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .cap b{font-size:46px;font-weight:900;letter-spacing:2px;line-height:1.15}
  .cap span{font-size:28px;font-weight:500;color:#8fd0ff;margin-top:2px}
  .num{position:absolute;right:60px;top:66px;color:#666;font-size:30px;font-weight:700}
  /* 電影感版型（layout:'cine'） */
  .card.cine{padding:0;gap:0;background:#000}
  .card.cine .half{position:relative;width:1080px;height:675px;overflow:hidden}
  .card.cine .cine-panel{width:1080px;height:675px}
  .card.cine .sub{position:absolute;left:0;right:0;bottom:46px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .card.cine .sub b{background:#fff;color:#111;font-size:42px;font-weight:700;padding:4px 20px;border-radius:4px;letter-spacing:1px}
  .card.cine .half:first-child .sub{top:40px;bottom:auto}
  .card.cine .sub span{background:rgba(0,0,0,.55);color:#8fd0ff;font-size:26px;font-weight:500;padding:3px 14px;border-radius:4px}
</style></head><body>

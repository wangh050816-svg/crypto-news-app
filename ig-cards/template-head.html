<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#111;font-family:"Noto Sans TC","WenQuanYi Zen Hei",sans-serif}
  .card{width:1080px;height:1350px;background:#0b0b0b;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:44px 0 0;margin-bottom:20px;position:relative}
  h1{color:#fff;font-size:82px;font-weight:900;margin:0 0 26px;letter-spacing:2px}
  .panel{width:960px;height:470px;display:block}
  .cap{height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .cap b{font-size:46px;font-weight:900;letter-spacing:2px;line-height:1.15}
  .cap span{font-family:"Noto Sans","DejaVu Sans",sans-serif;font-size:28px;font-weight:500;color:#8fd0ff;margin-top:2px}
  .num{position:absolute;right:60px;top:66px;color:#666;font-size:30px;font-weight:700}

  .q{padding-top:40px}
  .qhead{width:960px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;color:#f2c46d;font-size:30px;font-weight:900;letter-spacing:4px}
  .qhead i{font-style:normal;color:#666;font-size:28px;letter-spacing:2px}
  .qpanel{width:960px;height:640px;display:block}
  .qbody{width:900px;flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:30px}

<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0d10;--panel:#16181d;--line:#2a2d35;--text:#f4f5f7;--muted:#9aa0ab;--accent:#ff4d4f;--gold:#f5b82e;--blue:#8fd0ff}
  body{margin:0;background:#000;font-family:"Noto Sans TC","WenQuanYi Zen Hei",sans-serif;color:var(--text)}
  .slide{width:1080px;height:1350px;background:var(--bg);position:relative;overflow:hidden;box-sizing:border-box;padding:72px 84px;margin-bottom:20px;display:flex;flex-direction:column}
  .slide::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 600px at 100% 0%,rgba(255,77,79,.14),transparent 60%);pointer-events:none}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700;color:var(--muted);letter-spacing:3px;position:relative}
  .top .tag{display:flex;align-items:center;gap:14px}
  .top .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(255,77,79,.2)}
  .top .pg{font-family:Inter,sans-serif}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--muted);border-top:2px solid var(--line);padding-top:28px;position:relative}
  .foot .swipe{color:var(--text);font-weight:700}
  .num{font-family:Inter,sans-serif;font-weight:900;color:var(--accent);font-size:44px;letter-spacing:2px;margin-top:90px}
  h2{font-size:68px;font-weight:900;line-height:1.22;margin:14px 0 0;letter-spacing:1px}
  .body{font-size:36px;line-height:1.8;color:#d5d8de;font-weight:500;margin-top:40px}
  .body b{color:var(--text);font-weight:900}
  .hl{color:var(--gold)}
  .viz{margin-top:52px}
  /* cover */
  .cover .kicker{display:inline-block;background:var(--accent);color:#fff;font-weight:900;font-size:30px;padding:10px 22px;letter-spacing:4px;margin-top:110px;align-self:flex-start}
  .cover .big{font-family:Inter,sans-serif;font-weight:900;font-size:230px;line-height:1;letter-spacing:-6px;margin-top:40px;color:var(--text)}
  .cover .big small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:56px;letter-spacing:2px;color:var(--gold);margin-top:18px}
  .cover h1{font-size:84px;font-weight:900;line-height:1.2;margin:30px 0 0}
  .cover .sub{font-size:44px;font-weight:700;line-height:1.45;margin-top:36px;color:#d5d8de;border-left:8px solid var(--accent);padding-left:28px}
  /* end */
  .end h2{margin-top:70px}
  .tk{display:flex;gap:28px;align-items:flex-start;padding:30px 0;border-bottom:2px solid var(--line);font-size:36px;line-height:1.55;font-weight:500;color:#d5d8de}
  .tk i{font-style:normal;font-family:Inter,sans-serif;font-weight:900;color:var(--accent);font-size:40px;min-width:60px}
  .tk b{color:var(--text)}
  .ask{margin-top:48px;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:38px 44px;font-size:40px;font-weight:900;line-height:1.5}
  .ask span{display:block;font-size:28px;font-weight:500;color:var(--muted);margin-top:10px}
  .note{font-size:22px;color:#6b717c;margin-top:28px;line-height:1.6}
</style></head><body>
